<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .login-card { animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="login-card w-full max-w-sm bg-white p-10 rounded-[3rem] shadow-2xl text-center border border-slate-100">
        <!-- Logo Section -->
        <div class="w-20 h-20 bg-blue-600 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-xl shadow-blue-100">
            <i class="fa fa-graduation-cap text-white text-4xl"></i>
        </div>
        
        <h1 class="text-3xl font-black text-slate-800 mb-2 tracking-tight">ExamMaster</h1>
        <p class="text-slate-400 mb-10 text-sm font-medium">Apna account setup karein aur tests shuru karein</p>
        
        <!-- Login Button -->
        <button id="login-btn" class="w-full flex items-center justify-center gap-4 bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-xl">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png" class="w-6 h-6">
            <span>Google se Continue Karein</span>
        </button>
        
        <!-- Loading UI -->
        <div id="loader" class="mt-6 hidden">
            <div class="animate-spin h-6 w-6 border-b-2 border-blue-600 mx-auto rounded-full"></div>
            <p class="text-[10px] font-black text-slate-400 mt-3 uppercase tracking-widest">Database Syncing...</p>
        </div>
        
        <!-- Error Message -->
        <p id="error-msg" class="mt-6 text-red-500 text-xs font-bold hidden bg-red-50 p-3 rounded-xl border border-red-100"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Aapki Final Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const loginBtn = document.getElementById('login-btn');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');

        document.getElementById('login-btn').onclick = async () => {
            loginBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // FIRESTORE ENTRY LOGIC: Naye collection 'users' mein data save karna
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    // Yahan 'users' collection apne aap ban jayega agar nahi hai toh
                    await setDoc(userRef, {
                        displayName: user.displayName,
                        email: user.email,
                        photoURL: user.photoURL,
                        uid: user.uid,
                        purchasedSeries: [], // Pehli baar khali list banegi
                        accountCreated: serverTimestamp(),
                        lastLogin: serverTimestamp()
                    });
                    console.log("Database mein naya user profile ban gaya!");
                } else {
                    // Agar user pehle se hai (par aapne delete kar diya tha toh upar wala block chalega)
                    await setDoc(userRef, {
                        lastLogin: serverTimestamp(),
                        photoURL: user.photoURL,
                        displayName: user.displayName
                    }, { merge: true });
                    console.log("Existing profile update ho gayi!");
                }

                checkRedirect(user.email);
            } catch (err) {
                loader.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                errorMsg.innerText = "Error: " + err.message;
                errorMsg.classList.remove('hidden');
                console.error("Login Error:", err);
            }
        };

        function checkRedirect(email) {
            if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "home.html";
            }
        }

        // Auto-check on Page Load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                checkRedirect(user.email);
            }
        });
    </script>
</body>
</html>
