<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Secure Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #f8fafc, #eff6ff);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm glass-card p-10 rounded-[3rem] shadow-2xl text-center relative overflow-hidden">

        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-100 rounded-full blur-3xl opacity-50"></div>

        <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-700 rounded-[2rem] flex items-center justify-center mx-auto mb-10 shadow-xl shadow-blue-200 transform rotate-6 hover:rotate-0 transition-transform duration-500">
            <i class="fa fa-graduation-cap text-white text-5xl"></i>
        </div>

        <h1 class="text-3xl font-black text-slate-800 mb-3 tracking-tight">
            ExamMaster
        </h1>

        <p class="text-slate-400 mb-12 text-sm font-medium leading-relaxed">
            Your secure gateway to <br> premium test series.
        </p>

        <button 
            id="login-btn"
            class="group w-full flex items-center justify-center gap-4 bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-2xl relative overflow-hidden"
        >
            <img 
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png"
                class="w-6 h-6"
                alt="Google"
            >

            <span id="btn-text">
                Sign In with Google
            </span>
        </button>

        <div 
            id="status-msg"
            class="mt-6 p-4 bg-red-50 text-red-600 rounded-xl text-xs font-bold hidden border border-red-100"
        ></div>

        <p class="mt-10 text-[10px] text-slate-300 uppercase font-black tracking-widest">
            Powered by Firebase Security
        </p>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        import { 
            getAuth,
            signInWithPopup,
            GoogleAuthProvider,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        import { firebaseConfig, ADMIN_EMAIL } from './config.js';

        // Firebase Initialize
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);

        const provider = new GoogleAuthProvider();

        // Elements
        const loginBtn = document.getElementById('login-btn');

        const btnText = document.getElementById('btn-text');

        const statusMsg = document.getElementById('status-msg');

        // Login Function
        loginBtn.onclick = async () => {

            statusMsg.classList.add('hidden');

            loginBtn.disabled = true;

            btnText.innerText = "Authenticating...";

            try {

                // Persistent Login
                await setPersistence(auth, browserLocalPersistence);

                // Google Popup Login
                const result = await signInWithPopup(auth, provider);

                const user = result.user;

                // Save User Data in Firestore
                await setDoc(
                    doc(db, "users", user.uid),
                    {
                        uid: user.uid,
                        displayName: user.displayName || "",
                        email: user.email || "",
                        photoURL: user.photoURL || "",
                        provider: "google",
                        lastLogin: new Date().toLocaleString(),

                        createdAt: new Date().toISOString()
                    },
                    { merge: true }
                );

            } catch (err) {

                console.error("Auth Error:", err);

                statusMsg.innerText = "Error: " + err.message;

                statusMsg.classList.remove('hidden');

                loginBtn.disabled = false;

                btnText.innerText = "Sign In with Google";
            }
        };

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {

            if (user) {

                if (
                    user.email &&
                    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
                ) {

                    window.location.href = "admin.html";

                } else {

                    window.location.href = "home.html";
                }
            }
        });

    </script>

</body>
</html>
