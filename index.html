<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="fade-in w-full max-w-sm bg-white p-10 rounded-[3rem] shadow-2xl text-center border border-slate-100">
        <!-- Logo Icon -->
        <div id="icon-container" class="w-20 h-20 bg-blue-600 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 shadow-xl shadow-blue-200 transition-all duration-500">
            <i id="main-icon" class="fa fa-graduation-cap text-white text-4xl"></i>
        </div>
        
        <h1 class="text-3xl font-black text-slate-800 mb-2">ExamMaster</h1>
        <p id="status-text" class="text-slate-400 mb-10 text-sm font-medium">Please sign in to continue</p>
        
        <!-- Login Button -->
        <button id="login-btn" class="w-full flex items-center justify-center gap-4 bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-xl">
            <img src="google_logo.png" class="w-6 h-6" onerror="this.src='https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png'">
            <span>Login with Google</span>
        </button>
        
        <!-- Processing State -->
        <div id="loader" class="mt-8 hidden">
            <div class="flex justify-center space-x-2 mb-4">
                <div class="w-3 h-3 bg-blue-600 rounded-full animate-bounce"></div>
                <div class="w-3 h-3 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-3 h-3 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            </div>
            <p id="loader-text" class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Authenticating...</p>
        </div>
        
        <!-- Error and Disabled Account Message -->
        <div id="error-container" class="mt-6 hidden">
            <p id="error-msg" class="text-red-500 text-xs font-bold bg-red-50 p-4 rounded-2xl mb-4"></p>
            <a id="support-btn" href="mailto:support@exammaster.com" class="hidden w-full flex items-center justify-center gap-2 bg-blue-50 text-blue-600 font-bold py-3 rounded-xl text-xs border border-blue-100">
                <i class="fa fa-envelope"></i>
                <span>Contact Administrator</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        const loginBtn = document.getElementById('login-btn');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const statusText = document.getElementById('status-text');
        const iconContainer = document.getElementById('icon-container');
        const mainIcon = document.getElementById('main-icon');
        const errorContainer = document.getElementById('error-container');
        const errorMsg = document.getElementById('error-msg');
        const supportBtn = document.getElementById('support-btn');

        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        loginBtn.onclick = async () => {
            hideError();
            loginBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            statusText.innerText = "Authenticating...";
            
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Check if user is disabled in Firestore
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    if (data.status === 'disabled') {
                        await signOut(auth);
                        showDisabledState();
                        return;
                    }
                }

                // Proceed with normal login/registration if not disabled
                const userData = {
                    uid: user.uid,
                    displayName: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL,
                    lastLogin: serverTimestamp(),
                    status: userSnap.exists() ? (userSnap.data().status || 'active') : 'active'
                };

                if (!userSnap.exists()) {
                    userData.accountCreated = serverTimestamp();
                    userData.purchasedSeries = [];
                }

                await setDoc(userDocRef, userData, { merge: true });

                iconContainer.classList.replace('bg-blue-600', 'bg-green-500');
                mainIcon.classList.replace('fa-graduation-cap', 'fa-check');
                loaderText.innerText = "Access Granted...";

                setTimeout(() => {
                    handleNavigation(user.email);
                }, 1000);

            } catch (err) {
                console.error(err);
                showError("Login failed: " + err.message);
            }
        };

        function showDisabledState() {
            loginBtn.classList.remove('hidden');
            loader.classList.add('hidden');
            statusText.innerText = "Access Denied";
            iconContainer.classList.replace('bg-blue-600', 'bg-red-500');
            mainIcon.classList.replace('fa-graduation-cap', 'fa-user-slash');
            
            errorContainer.classList.remove('hidden');
            errorMsg.innerText = "Your account has been suspended by the administrator. Please contact support to regain access.";
            supportBtn.classList.remove('hidden');
        }

        function showError(msg) {
            loginBtn.classList.remove('hidden');
            loader.classList.add('hidden');
            errorContainer.classList.remove('hidden');
            errorMsg.innerText = msg;
            supportBtn.classList.add('hidden');
        }

        function hideError() {
            errorContainer.classList.add('hidden');
        }

        function handleNavigation(email) {
            if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "home.html";
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    if (userSnap.data().status === 'disabled') {
                        await signOut(auth);
                        showDisabledState();
                    } else {
                        handleNavigation(user.email);
                    }
                }
            }
        });
    </script>
</body>
</html>
