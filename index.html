<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #f8fafc, #eff6ff);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1e293b;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm glass-card p-10 rounded-[3rem] shadow-2xl text-center relative overflow-hidden">
        <!-- Background Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-100 rounded-full blur-3xl opacity-50"></div>
        
        <!-- App Logo -->
        <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-700 rounded-[2rem] flex items-center justify-center mx-auto mb-10 shadow-xl shadow-blue-200 transform rotate-6 hover:rotate-0 transition-all duration-500">
            <i class="fa fa-graduation-cap text-white text-5xl"></i>
        </div>
        
        <h1 class="text-3xl font-black text-slate-800 mb-3 tracking-tight">ExamMaster</h1>
        <p class="text-slate-400 mb-12 text-sm font-medium leading-relaxed">
            Your secure gateway to <br> premium test series.
        </p>
        
        <!-- Login Button -->
        <button id="login-btn" class="group w-full flex items-center justify-center gap-4 bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-2xl relative overflow-hidden">
            <div id="btn-loader" class="loader hidden"></div>
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png" id="google-logo" class="w-6 h-6" alt="Google">
            <span id="btn-text">Sign In with Google</span>
            <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform"></div>
        </button>
        
        <!-- Error/Status Display -->
        <div id="status-msg" class="mt-6 p-4 bg-red-50 text-red-600 rounded-xl text-xs font-bold hidden border border-red-100"></div>
        
        <p class="mt-10 text-[10px] text-slate-300 uppercase font-black tracking-widest">Secure Firebase Authentication</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            setPersistence, 
            browserLocalPersistence 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        // Aapke config.js se values import ho rahi hain
        import { firebaseConfig, ADMIN_EMAIL } from './config.js';

        // Firebase Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');
        const statusMsg = document.getElementById('status-msg');
        const btnLoader = document.getElementById('btn-loader');
        const googleLogo = document.getElementById('google-logo');

        // Login function
        loginBtn.onclick = async () => {
            // UI Update
            statusMsg.classList.add('hidden');
            loginBtn.disabled = true;
            btnText.innerText = "Verifying Account...";
            btnLoader.classList.remove('hidden');
            googleLogo.classList.add('hidden');

            try {
                // Persistent session
                await setPersistence(auth, browserLocalPersistence);
                // Google Login Popup
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Redirect logic based on email
                checkUserRole(user.email);

            } catch (err) {
                console.error("Auth Error:", err);
                statusMsg.innerText = "Login Failed: " + err.message;
                statusMsg.classList.remove('hidden');
                
                // Reset UI
                loginBtn.disabled = false;
                btnText.innerText = "Sign In with Google";
                btnLoader.classList.add('hidden');
                googleLogo.classList.remove('hidden');
            }
        };

        // Role check logic
        function checkUserRole(email) {
            if (email === ADMIN_EMAIL) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "home.html";
            }
        }

        // Auth state persistence check
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Agar user pehle se logged in hai, toh automatically redirect karo
                checkUserRole(user.email);
            }
        });
    </script>
</body>
</html>
