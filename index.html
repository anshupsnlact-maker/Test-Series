<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6 font-sans">

    <div class="w-full max-w-sm bg-white p-10 rounded-[3rem] shadow-2xl text-center border border-slate-100">
        <!-- Logo -->
        <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-700 rounded-[2rem] flex items-center justify-center mx-auto mb-10 shadow-xl shadow-blue-200 rotate-6">
            <i class="fa fa-graduation-cap text-white text-5xl"></i>
        </div>
        
        <h1 class="text-3xl font-black text-slate-800 mb-3">ExamMaster</h1>
        <p class="text-slate-400 mb-12 text-sm font-medium">Smart login for personalized <br>learning experience.</p>
        
        <!-- Login Button -->
        <button id="login-btn" class="w-full flex items-center justify-center gap-4 bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-2xl">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png" class="w-6 h-6" alt="Google">
            Sign In with Google
        </button>
        
        <div id="status-msg" class="mt-4 text-xs font-bold text-red-500 hidden"></div>
        <p class="mt-6 text-[10px] text-slate-400 font-bold uppercase tracking-widest">Automatic Role Detection</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            setPersistence, 
            browserLocalPersistence 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // ⚠️ APNA ADMIN EMAIL YAHAN LIKHEIN ⚠️
        const ADMIN_EMAIL = "anshupsnlact@gmail.com"; 

        const loginBtn = document.getElementById('login-btn');
        const statusMsg = document.getElementById('status-msg');

        loginBtn.onclick = async () => {
            loginBtn.disabled = true;
            loginBtn.innerText = "Checking Credentials...";
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, provider);
            } catch (err) {
                statusMsg.innerText = "Error: " + err.message;
                statusMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png" class="w-6 h-6"> Sign In with Google`;
            }
        };

        // Automatic Redirect Logic based on Email
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "home.html";
                }
            }
        });
    </script>
</body>
</html>
