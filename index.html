<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="fade-in w-full max-w-sm bg-white p-10 rounded-[3rem] shadow-2xl text-center border border-slate-100">
        <!-- Logo Icon -->
        <div id="icon-container" class="w-20 h-20 bg-blue-600 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 shadow-xl shadow-blue-200 transition-all duration-500">
            <i id="main-icon" class="fa fa-graduation-cap text-white text-4xl"></i>
        </div>
        
        <h1 class="text-3xl font-black text-slate-800 mb-2">ExamMaster</h1>
        <p id="status-text" class="text-slate-400 mb-10 text-sm font-medium">Please sign in to continue</p>
        
        <!-- Login Button -->
        <button id="login-btn" class="w-full flex items-center justify-center gap-4 bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-xl">
            <img src="google_logo.png" class="w-6 h-6" alt="Google" onerror="this.src='https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png'">
            <span>Login with Google</span>
        </button>
        
        <!-- Support Button (Only visible if disabled) -->
        <a id="support-btn" href="mailto:support@exammaster.com" class="mt-4 w-full hidden flex items-center justify-center gap-4 bg-blue-50 text-blue-600 font-bold py-5 rounded-2xl border border-blue-100 transition-all active:scale-95">
            <i class="fa fa-envelope"></i>
            <span>Contact Support</span>
        </a>
        
        <!-- Processing State -->
        <div id="loader" class="mt-8 hidden">
            <div class="flex justify-center space-x-2 mb-4">
                <div class="w-3 h-3 bg-blue-600 rounded-full animate-bounce"></div>
                <div class="w-3 h-3 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-3 h-3 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            </div>
            <p id="loader-text" class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Authenticating...</p>
        </div>
        
        <p id="error-msg" class="mt-6 text-red-500 text-xs font-bold hidden bg-red-50 p-4 rounded-2xl leading-relaxed"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithRedirect, 
            getRedirectResult,
            signOut,
            GoogleAuthProvider, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        const loginBtn = document.getElementById('login-btn');
        const supportBtn = document.getElementById('support-btn');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const statusText = document.getElementById('status-text');
        const iconContainer = document.getElementById('icon-container');
        const mainIcon = document.getElementById('main-icon');
        const errorMsg = document.getElementById('error-msg');

        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        loginBtn.onclick = () => {
            loginBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            statusText.innerText = "Redirecting to Google...";
            signInWithRedirect(auth, provider);
        };

        async function handleAuthResult() {
            try {
                const result = await getRedirectResult(auth);
                if (result && result.user) {
                    await checkUserStatusAndNavigate(result.user);
                }
            } catch (err) {
                showError("Authentication failed. Please try again.");
            }
        }

        async function checkUserStatusAndNavigate(user) {
            loader.classList.remove('hidden');
            loaderText.innerText = "Verifying Account Status...";
            
            const userDocRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userDocRef);

            // Check if account is disabled
            if (userSnap.exists() && userSnap.data().status === 'disabled') {
                await signOut(auth);
                showDisabledUI();
                return;
            }

            // Update or Create user data
            const userData = {
                uid: user.uid,
                displayName: user.displayName,
                email: user.email,
                photoURL: user.photoURL,
                lastLogin: serverTimestamp(),
                status: userSnap.exists() ? (userSnap.data().status || 'active') : 'active'
            };

            if (!userSnap.exists()) {
                userData.accountCreated = serverTimestamp();
                userData.purchasedSeries = [];
                await setDoc(userDocRef, userData);
            } else {
                await setDoc(userDocRef, userData, { merge: true });
            }

            // Success Transition
            iconContainer.classList.replace('bg-blue-600', 'bg-green-500');
            mainIcon.classList.replace('fa-graduation-cap', 'fa-check');
            loaderText.innerText = "Authorized! Accessing Dashboard...";

            setTimeout(() => {
                if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "home.html";
                }
            }, 1000);
        }

        function showDisabledUI() {
            loader.classList.add('hidden');
            loginBtn.classList.add('hidden');
            supportBtn.classList.remove('hidden');
            
            iconContainer.classList.replace('bg-blue-600', 'bg-red-500');
            mainIcon.classList.replace('fa-graduation-cap', 'fa-user-slash');
            
            statusText.innerText = "Access Denied";
            statusText.classList.replace('text-slate-400', 'text-red-500');
            
            errorMsg.innerText = "Your account has been suspended by the administrator. Please contact support to restore access.";
            errorMsg.classList.remove('hidden');
        }

        function showError(msg) {
            loader.classList.add('hidden');
            loginBtn.classList.remove('hidden');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }

        // Initialize Redirect Check
        handleAuthResult();

        // Session Watcher
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists() && userSnap.data().status === 'disabled') {
                    await signOut(auth);
                    showDisabledUI();
                } else if (userSnap.exists()) {
                    // Pre-authenticated, just move to destination
                    if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "home.html";
                    }
                }
            }
        });
    </script>
</body>
</html>
