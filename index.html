<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .fade-in { animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="fade-in w-full max-w-sm bg-white p-10 rounded-[3rem] shadow-2xl text-center border border-slate-100">
        <!-- Brand Icon -->
        <div class="w-20 h-20 bg-blue-600 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 shadow-xl shadow-blue-200">
            <i class="fa fa-graduation-cap text-white text-4xl"></i>
        </div>
        
        <h1 class="text-3xl font-black text-slate-800 mb-2">ExamMaster</h1>
        <p class="text-slate-400 mb-10 text-sm font-medium">Automatic Account Setup Portal</p>
        
        <!-- Login Button -->
        <button id="login-btn" class="w-full flex items-center justify-center gap-4 bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all active:scale-95 shadow-xl">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_main_logo.png" class="w-6 h-6">
            <span>Sign In with Google</span>
        </button>
        
        <!-- Processing State -->
        <div id="loader" class="mt-8 hidden">
            <div class="flex justify-center gap-1 mb-3">
                <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Creating Document Fields...</p>
        </div>
        
        <p id="error-msg" class="mt-6 text-red-500 text-xs font-bold hidden bg-red-50 p-4 rounded-2xl"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your Firebase Configuration (Directly integrated as requested)
        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const loginBtn = document.getElementById('login-btn');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');

        loginBtn.onclick = async () => {
            loginBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // AUTOMATIC SYSTEM: Create/Verify User Document in Firestore
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    // Document nahi hai, isliye fields ke saath naya document banega
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        displayName: user.displayName,
                        email: user.email,
                        photoURL: user.photoURL,
                        purchasedSeries: [], // Automatic blank array
                        accountCreated: serverTimestamp(),
                        lastLogin: serverTimestamp(),
                        role: user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? "admin" : "student"
                    });
                    console.log("New document fields created successfully!");
                } else {
                    // Document hai, toh sirf login time aur basic info update hogi
                    await setDoc(userDocRef, {
                        lastLogin: serverTimestamp(),
                        displayName: user.displayName,
                        photoURL: user.photoURL
                    }, { merge: true });
                    console.log("Existing document updated!");
                }

                handleNavigation(user.email);
            } catch (err) {
                console.error("Firestore Entry Error:", err);
                loginBtn.classList.remove('hidden');
                loader.classList.add('hidden');
                errorMsg.innerText = "Error: " + err.message;
                errorMsg.classList.remove('hidden');
            }
        };

        function handleNavigation(email) {
            if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "home.html";
            }
        }

        // Auto-login logic
        onAuthStateChanged(auth, (user) => {
            if (user) handleNavigation(user.email);
        });
    </script>
</body>
</html>
