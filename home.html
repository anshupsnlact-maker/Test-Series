<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfeff; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="px-8 py-4 flex justify-between items-center border-b border-slate-100 bg-white sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                <i class="fa fa-graduation-cap"></i>
            </div>
            <span class="font-black text-slate-800">ExamMaster</span>
        </div>
        <div class="flex items-center gap-4">
            <a href="store.html" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg shadow-blue-100">
                <i class="fa fa-shopping-cart"></i> Buy Series
            </a>
            <button id="logout-btn" class="text-slate-400 hover:text-red-500 font-bold"><i class="fa fa-sign-out-alt text-xl"></i></button>
        </div>
    </nav>

    <header class="max-w-6xl mx-auto p-8">
        <div class="bg-slate-900 rounded-[2.5rem] p-10 text-white relative overflow-hidden">
            <div class="relative z-10">
                <h1 id="disp-name" class="text-4xl font-black mb-1 italic">Student Name</h1>
                <p id="disp-email" class="text-slate-400 text-sm font-medium">email@student.com</p>
                <div class="mt-8 flex gap-3">
                    <span class="bg-white/10 px-4 py-2 rounded-xl text-xs font-bold border border-white/10">
                        My Courses: <span id="course-count">0</span>
                    </span>
                </div>
            </div>
            <div class="absolute -right-20 -bottom-20 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-8">
        <h2 class="text-2xl font-black text-slate-800 mb-8">My Test Series</h2>
        
        <div id="loader" class="text-center py-20"><div class="animate-spin h-8 w-8 border-b-2 border-blue-600 mx-auto rounded-full"></div></div>
        
        <div id="series-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 hidden"></div>

        <div id="empty-box" class="hidden text-center py-20 bg-slate-50 rounded-[3rem] border-2 border-dashed border-slate-200">
            <i class="fa fa-folder-open text-4xl text-slate-200 mb-4"></i>
            <h3 class="text-lg font-bold text-slate-800">Koi Series Nahi Mili</h3>
            <p class="text-slate-400 text-sm mb-6">Aapne abhi tak koi test series nahi kharidi hai.</p>
            <a href="store.html" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold inline-block">Store Dekhein</a>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            
            document.getElementById('disp-name').innerText = user.displayName;
            document.getElementById('disp-email').innerText = user.email;

            const snap = await getDoc(doc(db, "users", user.uid));
            const data = snap.data();
            const seriesList = data.purchasedSeries || [];
            
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('course-count').innerText = seriesList.length;

            if (seriesList.length === 0) {
                document.getElementById('empty-box').classList.remove('hidden');
            } else {
                const grid = document.getElementById('series-grid');
                grid.classList.remove('hidden');
                seriesList.forEach(s => {
                    grid.innerHTML += `
                        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                            <h4 class="font-bold text-slate-800 mb-4">${s.name}</h4>
                            <button class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Start Test</button>
                        </div>`;
                });
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth);
    </script>
</body>
</html>
