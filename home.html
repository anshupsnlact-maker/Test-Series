<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .tab-active { color: #2563eb; border-bottom: 3px solid #2563eb; }
        #side-menu { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #side-menu.open { transform: translateX(0); }
        .modal-enter { animation: modalFade 0.3s ease-out; }
        @keyframes modalFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="pb-10">

    <!-- Account Disabled Overlay -->
    <div id="block-overlay" class="fixed inset-0 bg-slate-900/90 z-[200] flex items-center justify-center p-6 hidden">
        <div class="bg-white p-8 rounded-[2.5rem] text-center max-w-sm shadow-2xl">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                <i class="fa fa-user-slash"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">Access Restricted</h2>
            <p class="text-slate-500 text-sm mb-6">Your account has been disabled by the administrator.</p>
            <button onclick="logout()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Sign Out</button>
        </div>
    </div>

    <!-- Edit Name Modal -->
    <div id="profile-modal" class="fixed inset-0 bg-black/60 z-[150] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-xs p-8 rounded-[2.5rem] modal-enter shadow-2xl">
            <h3 class="text-xl font-black text-slate-800 mb-2 text-center">Display Name</h3>
            <p class="text-xs text-slate-400 text-center mb-6">Set your custom name for the dashboard.</p>
            <input type="text" id="custom-name-input" placeholder="Your Name" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none ring-2 ring-transparent focus:ring-blue-500 mb-4 font-bold text-center">
            <div class="flex gap-2">
                <button onclick="closeProfileModal()" class="flex-1 py-3 text-slate-400 font-bold text-sm">Cancel</button>
                <button onclick="saveCustomName()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-black text-sm shadow-lg shadow-blue-100">Update</button>
            </div>
        </div>
    </div>

    <!-- Sidebar Menu -->
    <div id="menu-overlay" class="fixed inset-0 bg-black/40 z-[100] hidden opacity-0 transition-opacity" onclick="toggleMenu()"></div>
    <div id="side-menu" class="fixed top-0 left-0 h-full w-72 bg-white z-[110] shadow-2xl p-6 flex flex-col">
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i class="fa fa-bolt"></i></div>
                <h2 class="text-xl font-black text-slate-800">ExamMaster</h2>
            </div>
            <button onclick="toggleMenu()" class="text-slate-300"><i class="fa fa-times text-xl"></i></button>
        </div>
        <div class="space-y-2 font-bold flex-1">
            <button onclick="openProfileModal(); toggleMenu()" class="w-full flex items-center gap-4 p-4 hover:bg-blue-50 rounded-2xl text-blue-600 transition text-left">
                <i class="fa fa-user-edit text-lg"></i> Edit Profile
            </button>
            <button onclick="switchTab('live'); toggleMenu()" class="w-full flex items-center gap-4 p-4 hover:bg-slate-50 rounded-2xl text-slate-600 transition text-left">
                <i class="fa fa-shopping-bag text-lg"></i> My Purchases
            </button>
            <button onclick="window.location.href='store.html'" class="w-full flex items-center gap-4 p-4 hover:bg-slate-50 rounded-2xl text-slate-600 transition text-left">
                <i class="fa fa-store text-lg"></i> Visit Store
            </button>
            <hr class="my-4 border-slate-100">
            <button onclick="logout()" class="w-full flex items-center gap-4 p-4 hover:bg-red-50 rounded-2xl text-red-500 transition text-left">
                <i class="fa fa-power-off text-lg"></i> Logout
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="p-6 flex justify-between items-center bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40">
        <div class="flex items-center gap-4">
            <div class="relative group cursor-pointer" onclick="openProfileModal()">
                <img id="user-img" src="https://via.placeholder.com/150" class="w-14 h-14 rounded-full border-4 border-white shadow-lg object-cover">
                <div class="absolute inset-0 bg-black/20 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <i class="fa fa-edit text-white text-xs"></i>
                </div>
            </div>
            <div>
                <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest leading-none mb-1">Welcome Back</p>
                <h1 id="user-name-display" class="text-xl font-black text-slate-800 leading-none">...</h1>
            </div>
        </div>
        <button onclick="toggleMenu()" class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-800 hover:bg-slate-100 transition">
            <i class="fa fa-bars-staggered text-lg"></i>
        </button>
    </header>

    <main class="max-w-xl mx-auto p-5">
        <!-- Dashboard Tabs -->
        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden mb-6 min-h-[400px] flex flex-col mt-4">
            <div class="flex border-b border-slate-100 bg-slate-50/50">
                <button onclick="switchTab('upcoming')" id="tab-upcoming" class="flex-1 py-5 text-[10px] font-black uppercase tracking-widest tab-active">New Tests</button>
                <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-5 text-[10px] font-black uppercase tracking-widest text-slate-400">My Exams</button>
            </div>

            <div id="content-box" class="p-6 flex-1 relative">
                <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center text-slate-300">
                    <i class="fa fa-circle-notch fa-spin text-3xl mb-2 text-blue-500"></i>
                    <p class="text-[10px] font-black uppercase tracking-widest">Loading</p>
                </div>
                <div id="empty-state" class="hidden flex flex-col items-center justify-center mt-20 text-center">
                    <i class="fa fa-inbox text-5xl text-slate-100 mb-4"></i>
                    <p class="text-sm font-bold text-slate-400">Nothing to show here</p>
                </div>
                <div id="items-container" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        import { firebaseConfig } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "exam-master-v1";

        let userState = { uid: null, customName: null };

        // Global Window Functions
        window.toggleMenu = () => {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            menu.classList.toggle('open');
            overlay.classList.toggle('hidden');
            setTimeout(() => overlay.classList.toggle('opacity-100'), 10);
        };

        window.openProfileModal = () => {
            document.getElementById('profile-modal').classList.remove('hidden');
            document.getElementById('custom-name-input').value = userState.customName || "";
        };

        window.closeProfileModal = () => document.getElementById('profile-modal').classList.add('hidden');

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");

        // Auth Logic
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                userState.uid = user.uid;
                document.getElementById('user-img').src = user.photoURL;

                // Sync Private Settings (Custom Name)
                const userPrivateRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'settings');
                onSnapshot(userPrivateRef, (docSnap) => {
                    if (docSnap.exists()) {
                        userState.customName = docSnap.data().displayName;
                        document.getElementById('user-name-display').innerText = userState.customName || user.displayName;
                    } else {
                        setDoc(userPrivateRef, { displayName: user.displayName, googleName: user.displayName });
                        document.getElementById('user-name-display').innerText = user.displayName;
                    }
                });

                // Sync Public Status (Block/Unblock)
                const studentPublicRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', user.uid);
                onSnapshot(studentPublicRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().disabled) {
                        document.getElementById('block-overlay').classList.remove('hidden');
                    }
                });

                switchTab('upcoming');
            }
        });

        window.saveCustomName = async () => {
            const newName = document.getElementById('custom-name-input').value.trim();
            if(!newName) return;
            const userPrivateRef = doc(db, 'artifacts', appId, 'users', userState.uid, 'profile', 'settings');
            try {
                await updateDoc(userPrivateRef, { displayName: newName });
                closeProfileModal();
            } catch (err) { console.error(err); }
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('tab-active', 'text-slate-400');
                if(btn.id === `tab-${tab}`) btn.classList.add('tab-active');
                else btn.classList.add('text-slate-400');
            });
            loadTabData(tab);
        };

        function loadTabData(tab) {
            const container = document.getElementById('items-container');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');
            
            container.innerHTML = "";
            loader.classList.remove('hidden');
            empty.classList.add('hidden');

            const purchaseRef = collection(db, 'artifacts', appId, 'users', userState.uid, 'purchases');
            
            onSnapshot(purchaseRef, (pSnap) => {
                const purchasedIds = pSnap.docs.map(doc => doc.id);

                if (tab === 'upcoming') {
                    onSnapshot(collection(db, "tests"), (tSnap) => {
                        loader.classList.add('hidden');
                        const available = tSnap.docs.filter(d => !purchasedIds.includes(d.id));
                        if(available.length === 0) empty.classList.remove('hidden');
                        available.forEach(doc => renderItem(doc.id, doc.data(), true));
                    });
                } else {
                    loader.classList.add('hidden');
                    if(pSnap.empty) empty.classList.remove('hidden');
                    pSnap.forEach(doc => renderItem(doc.id, doc.data(), false));
                }
            });
        }

        function renderItem(id, data, isUpcoming) {
            const container = document.getElementById('items-container');
            container.innerHTML += `
                <div class="p-6 rounded-[2rem] border ${isUpcoming ? 'bg-white border-slate-100' : 'bg-slate-900 text-white border-transparent'} flex justify-between items-center transition active:scale-95 cursor-pointer">
                    <div>
                        <h4 class="font-black text-sm">${data.title}</h4>
                        <p class="text-[9px] font-bold opacity-50 uppercase mt-1 tracking-wider">${isUpcoming ? 'Available in Store' : 'Active Subscription'}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full flex items-center justify-center ${isUpcoming ? 'bg-blue-50 text-blue-600' : 'bg-white/10 text-white'}">
                        <i class="fa ${isUpcoming ? 'fa-shopping-cart' : 'fa-play'} text-[10px]"></i>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
