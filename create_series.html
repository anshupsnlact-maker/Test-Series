<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Center - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; overflow-x: hidden; }
        
        #access-denied {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .form-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .input-field { width: 100%; padding: 0.85rem 1.25rem; border-radius: 1rem; border: 1.5px solid #e2e8f0; outline: none; transition: all 0.2s; font-size: 0.9rem; }
        .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .section-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #2563eb; color: white; font-weight: 700; padding: 1rem 2rem; border-radius: 1.25rem; transition: all 0.3s; }
        .btn-primary:hover { background: #1e40af; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="access-denied">
        <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-3xl flex items-center justify-center mb-6 animate-pulse">
            <i class="fa fa-shield-alt text-4xl"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-800">Security Check</h2>
        <p class="text-slate-400 mt-2 font-medium">Validating administrator session...</p>
        <button onclick="window.location.href='index.html'" id="back-btn" class="mt-8 px-6 py-3 bg-slate-900 text-white rounded-xl font-bold text-xs hidden">Back to Login</button>
    </div>

    <div id="main-content">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='admin.html'" class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center hover:bg-slate-200 transition-all">
                    <i class="fa fa-arrow-left text-slate-600"></i>
                </button>
                <h1 class="text-xl font-black text-slate-800 tracking-tight">Launch Center</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="admin-badge" class="text-[10px] font-black text-blue-600 uppercase tracking-widest bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">Auth: Active</span>
            </div>
        </nav>

        <main class="max-w-5xl mx-auto mt-10 px-6">
            <form id="series-form" class="space-y-8">
                
                <div class="form-card p-8 md:p-10">
                    <h3 class="section-title"><i class="fa fa-info-circle text-blue-500"></i> Primary Metadata</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Series Name</label>
                            <input type="text" id="seriesName" class="input-field" placeholder="Enter formal title" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Brief Summary</label>
                            <input type="text" id="shortDesc" class="input-field" placeholder="Short introduction for cards" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Full Specifications</label>
                            <textarea id="longDesc" rows="4" class="input-field" placeholder="Detailed syllabus and features..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-card p-8 md:p-10">
                    <h3 class="section-title"><i class="fa fa-tag text-green-500"></i> Commercials & Access</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-3">
                            <label class="block text-sm font-bold text-slate-700 mb-3">Billing Model</label>
                            <div class="flex gap-6">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="priceType" value="free" class="w-4 h-4 text-blue-600">
                                    <span class="text-sm font-semibold text-slate-600">Freemium</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="priceType" value="paid" checked class="w-4 h-4 text-blue-600">
                                    <span class="text-sm font-semibold text-slate-600">Premium Subscription</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">List Price (MRP)</label>
                            <input type="number" id="mrpPrice" class="input-field" placeholder="0.00">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Offer Price</label>
                            <input type="number" id="sellingPrice" class="input-field" placeholder="0.00">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Markdown (%)</label>
                            <input type="text" id="discountPercent" class="input-field bg-slate-50 font-bold text-blue-600" readonly value="0%">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Validity (Months)</label>
                            <input type="number" id="validity" class="input-field" placeholder="e.g. 12">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Unit Count (Tests)</label>
                            <input type="number" id="testCount" class="input-field" placeholder="e.g. 50">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Category/Subjects</label>
                            <input type="text" id="subjects" class="input-field" placeholder="PCM / Humanities">
                        </div>
                    </div>
                </div>

                <div class="form-card p-8 md:p-10">
                    <h3 class="section-title"><i class="fa fa-link text-purple-500"></i> Cloud Assets</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Cover Artwork (URL)</label>
                            <input type="url" id="bannerUrl" class="input-field" placeholder="https://cdn.link/banner.png">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Syllabus Archive (URL)</label>
                            <input type="url" id="syllabusUrl" class="input-field" placeholder="https://drive.link/file.pdf">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Excel Dataset / Timing Sheet (URL)</label>
                            <input type="url" id="excelLink" class="input-field" placeholder="Deployment source link">
                        </div>
                    </div>
                </div>

                <div class="form-card p-8 md:p-10">
                    <h3 class="section-title"><i class="fa fa-sliders-h text-orange-500"></i> System Configuration</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Target Language</label>
                            <select id="language" class="input-field">
                                <option value="English">English</option>
                                <option value="Hindi">Hindi</option>
                                <option value="Bilingual">Bilingual</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Randomization</label>
                            <select id="shuffle" class="input-field">
                                <option value="Yes">Enabled (Shuffle)</option>
                                <option value="No">Disabled (Linear)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Solution Visibility</label>
                            <select id="showSolutions" class="input-field">
                                <option value="Immediate">Post-Submission</option>
                                <option value="Scheduled">Scheduled Delay</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Negative Indexing</label>
                            <input type="text" id="negativeMarking" class="input-field" placeholder="e.g. Standard -1/4">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Deployment Schedule</label>
                            <input type="datetime-local" id="launchDate" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Promotion Tag</label>
                            <select id="featuredTag" class="input-field">
                                <option value="None">None</option>
                                <option value="New Launch">New Launch</option>
                                <option value="Top Rated">Top Rated</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-4">
                    <button type="button" onclick="window.location.href='admin.html'" class="bg-slate-200 text-slate-600 font-bold px-8 py-4 rounded-2xl hover:bg-slate-300 transition-all">Discard</button>
                    <button type="submit" id="submitBtn" disabled class="btn-primary flex items-center gap-3 opacity-60 cursor-not-allowed">
                        <i class="fa fa-bolt"></i>
                        Initialize Deployment
                    </button>
                </div>

            </form>
        </main>
    </div>

    <div id="successModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-[3rem] p-10 max-w-sm w-full text-center shadow-2xl">
            <div class="w-20 h-20 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl">
                <i class="fa fa-check text-4xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">Series Active!</h2>
            <p class="text-slate-500 text-sm mb-8 font-medium">Test series metadata synchronized successfully.</p>
            <button onclick="window.location.href='admin.html'" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl">Return to Console</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const accessDenied = document.getElementById('access-denied');
        const mainContent = document.getElementById('main-content');
        const backBtn = document.getElementById('back-btn');

        let adminVerified = false;

// Elements
const adminBadge = document.getElementById('admin-badge');

// Cached login check
const cachedUser = auth.currentUser;

// Instant UI load
if (
    cachedUser &&
    cachedUser.email &&
    cachedUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
) {
    
    accessDenied.classList.add('hidden');
    mainContent.classList.remove('invisible');
    
} else {
    
    showAccessDenied("Invalid Session");
}

// Background verification
onAuthStateChanged(auth, async (user) => {
    
    if (!user) {
        
        showAccessDenied("Session Expired");
        
        return;
    }
    
    if (
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {
        
        showAccessDenied("Unauthorized Admin");
        
        return;
    }
    
    try {
        
        // Force secure token verification
        await user.getIdToken(true);
        
        adminVerified = true;
        
        // Enable submit button
        submitBtn.disabled = false;
        
        submitBtn.classList.remove(
            'opacity-60',
            'cursor-not-allowed'
        );
        
        adminBadge.innerText = "Auth: Verified";
        
    } catch (error) {
        
        console.error(error);
        
        showAccessDenied(
            "Database Verification Failed"
        );
    }
});

// Access denied function
function showAccessDenied(message) {
    
    accessDenied.classList.remove('hidden');
    
    accessDenied.querySelector('h2').innerText =
        "Access Denied";
    
    accessDenied.querySelector('p').innerText =
        message;
    
    backBtn.classList.remove('hidden');
    
    mainContent.innerHTML = "";
}

        const form = document.getElementById('series-form');
        const mrpInput = document.getElementById('mrpPrice');
        const sellingInput = document.getElementById('sellingPrice');
        const discountDisplay = document.getElementById('discountPercent');
        const submitBtn = document.getElementById('submitBtn');

        mrpInput.oninput = sellingInput.oninput = () => {
            const mrp = parseFloat(mrpInput.value) || 0;
            const selling = parseFloat(sellingInput.value) || 0;
            discountDisplay.value = (mrp > 0 && selling > 0) ? Math.max(0, Math.round(((mrp - selling) / mrp) * 100)) + "% OFF" : "0%";
        };

        form.onsubmit = async (e) => {
            if (!adminVerified) {

    alert(
        "Please wait for admin verification."
    );

    return;
}
            e.preventDefault();
            
            // Re-verify auth before sending data to Firestore
            const currentUser = auth.currentUser;
            if (!currentUser || currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                alert("Security Violation: You are not authorized to perform this action.");
                window.location.reload();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa fa-sync animate-spin"></i> Processing...`;

            try {
                const seriesData = {
                    name: document.getElementById('seriesName').value,
                    shortDescription: document.getElementById('shortDesc').value,
                    longDescription: document.getElementById('longDesc').value,
                    bannerUrl: document.getElementById('bannerUrl').value,
                    syllabusUrl: document.getElementById('syllabusUrl').value,
                    priceType: document.querySelector('input[name="priceType"]:checked').value,
                    mrp: parseFloat(mrpInput.value) || 0,
                    sellingPrice: parseFloat(sellingInput.value) || 0,
                    discount: discountDisplay.value,
                    validityMonths: parseInt(document.getElementById('validity').value) || 0,
                    totalTests: parseInt(document.getElementById('testCount').value) || 0,
                    subjects: document.getElementById('subjects').value.split(',').map(s => s.trim()),
                    language: document.getElementById('language').value,
                    shuffleQuestions: document.getElementById('shuffle').value,
                    showSolutions: document.getElementById('showSolutions').value,
                    negativeMarking: document.getElementById('negativeMarking').value,
                    launchDate: document.getElementById('launchDate').value,
                    featuredTag: document.getElementById('featuredTag').value,
                    excelLink: document.getElementById('excelLink').value,
                    createdAt: serverTimestamp(),
                    createdBy: currentUser.uid,
                    status: 'active'
                };

                await addDoc(collection(db, "test_series"), seriesData);
                document.getElementById('successModal').classList.replace('hidden', 'flex');
            } catch (err) {
                console.error("Firestore Error:", err);
                // Specific check for permission error
                if (err.code === 'permission-denied') {
                    alert("Firestore Permission Denied: Please check your Database Rules.");
                } else {
                    alert("Error: " + err.message);
                }
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
    <i class="fa fa-bolt"></i>
    Initialize Deployment
`;
            }
        };
    </script>
</body>
    </html>
