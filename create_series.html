<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test Series - Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .form-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .input-field { width: 100%; padding: 0.85rem 1.25rem; border-radius: 1rem; border: 1.5px solid #e2e8f0; outline: none; transition: all 0.2s; font-size: 0.9rem; }
        .input-field:focus { border-color: #2563eb; ring: 2px ring-blue-100; }
        .section-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 1.5rem; display: flex; items-center: center; gap: 0.5rem; }
        .btn-primary { background: #2563eb; color: white; font-weight: 700; padding: 1rem 2rem; border-radius: 1.25rem; transition: all 0.3s; }
        .btn-primary:hover { background: #1e40af; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .btn-primary:active { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header Navigation -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='admin.html'" class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center hover:bg-slate-200 transition-all">
                <i class="fa fa-arrow-left text-slate-600"></i>
            </button>
            <h1 class="text-xl font-black text-slate-800">Launch New Series</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">Draft Mode Auto-Save</span>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto mt-10 px-6">
        <form id="series-form" class="space-y-8">
            
            <!-- Basic Information -->
            <div class="form-card p-8 md:p-10">
                <h3 class="section-title"><i class="fa fa-info-circle text-blue-500"></i> Basic Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Test Series Name</label>
                        <input type="text" id="seriesName" class="input-field" placeholder="e.g. Target JEE 2028: Physics Mastery" required>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Short Intro (For Card)</label>
                        <input type="text" id="shortDesc" class="input-field" placeholder="Brief 2-3 line overview of the series" required>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Detailed About / Features</label>
                        <textarea id="longDesc" rows="5" class="input-field" placeholder="Explain full syllabus, benefits, and teaching style..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Media & Assets -->
            <div class="form-card p-8 md:p-10">
                <h3 class="section-title"><i class="fa fa-image text-purple-500"></i> Media & Syllabus</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Series Banner/Thumbnail (Link)</label>
                        <input type="url" id="bannerUrl" class="input-field" placeholder="https://image-link.com/photo.jpg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Syllabus PDF (Link)</label>
                        <input type="url" id="syllabusUrl" class="input-field" placeholder="https://drive-link.com/syllabus.pdf">
                    </div>
                </div>
            </div>

            <!-- Pricing & Validity -->
            <div class="form-card p-8 md:p-10">
                <h3 class="section-title"><i class="fa fa-tag text-green-500"></i> Pricing & Access</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-3 mb-2">
                        <label class="block text-sm font-bold text-slate-700 mb-3">Price Type</label>
                        <div class="flex gap-6">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="priceType" value="free" class="w-4 h-4 text-blue-600">
                                <span class="text-sm font-semibold text-slate-600">Free Access</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="priceType" value="paid" checked class="w-4 h-4 text-blue-600">
                                <span class="text-sm font-semibold text-slate-600">Paid Enrollment</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Original Price (MRP)</label>
                        <input type="number" id="mrpPrice" class="input-field" placeholder="₹999">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Selling Price</label>
                        <input type="number" id="sellingPrice" class="input-field" placeholder="₹499">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Discount (%)</label>
                        <input type="text" id="discountPercent" class="input-field bg-slate-50 font-bold text-blue-600" readonly value="0%">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Access Validity (Months)</label>
                        <input type="number" id="validity" class="input-field" placeholder="e.g. 12">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Total Tests</label>
                        <input type="number" id="testCount" class="input-field" placeholder="e.g. 25">
                    </div>
                </div>
            </div>

            <!-- Configuration -->
            <div class="form-card p-8 md:p-10">
                <h3 class="section-title"><i class="fa fa-cog text-orange-500"></i> Exam Configuration</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Subject Tags (Comma separated)</label>
                        <input type="text" id="subjects" class="input-field" placeholder="Physics, Chemistry, Maths">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Exam Language</label>
                        <select id="language" class="input-field">
                            <option value="English">English Only</option>
                            <option value="Hindi">Hindi Only</option>
                            <option value="Bilingual">Bilingual (Both)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Shuffle Questions</label>
                        <select id="shuffle" class="input-field">
                            <option value="Yes">Yes (For every student)</option>
                            <option value="No">No (Fixed order)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Show Solutions</label>
                        <select id="showSolutions" class="input-field">
                            <option value="Immediate">Immediately after test</option>
                            <option value="Scheduled">Specific Date/Time</option>
                            <option value="Manual">Manual Publish</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Negative Marking Rule</label>
                        <input type="text" id="negativeMarking" class="input-field" placeholder="e.g. -1 for every wrong answer">
                    </div>
                </div>
            </div>

            <!-- Scheduling & Publication -->
            <div class="form-card p-8 md:p-10">
                <h3 class="section-title"><i class="fa fa-calendar-alt text-red-500"></i> Launch & Schedule</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Official Launch Date</label>
                        <input type="datetime-local" id="launchDate" class="input-field">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Featured Tag</label>
                        <select id="featuredTag" class="input-field">
                            <option value="None">None</option>
                            <option value="New Launch">New Launch</option>
                            <option value="Top Rated">Top Rated</option>
                            <option value="Best Seller">Best Seller</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Visibility Status</label>
                        <select id="status" class="input-field font-bold text-blue-600">
                            <option value="Draft">Draft (Hidden)</option>
                            <option value="Live">Live (Public)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Excel Questions File (Link)</label>
                        <input type="url" id="excelLink" class="input-field" placeholder="Google Drive or Direct URL">
                        <p class="text-[10px] text-slate-400 mt-2 font-bold uppercase"><i class="fa fa-info-circle mr-1"></i> Format: Q, A, B, C, D, Answer, Hint, Subject</p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-4">
                <button type="button" onclick="window.location.href='admin.html'" class="bg-slate-200 text-slate-600 font-bold px-8 py-4 rounded-2xl hover:bg-slate-300 transition-all">Cancel</button>
                <button type="submit" id="submitBtn" class="btn-primary flex items-center gap-3">
                    <i class="fa fa-paper-plane"></i>
                    Publish Test Series
                </button>
            </div>

        </form>
    </main>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-[3rem] p-10 max-w-sm w-full text-center shadow-2xl">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa fa-check text-4xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">Series Published!</h2>
            <p class="text-slate-500 text-sm mb-8 font-medium">Your new test series has been successfully added to the database.</p>
            <button onclick="window.location.href='admin.html'" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl">Return to Dashboard</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html";
            }
        });

        const form = document.getElementById('series-form');
        const mrpInput = document.getElementById('mrpPrice');
        const sellingInput = document.getElementById('sellingPrice');
        const discountDisplay = document.getElementById('discountPercent');
        const submitBtn = document.getElementById('submitBtn');

        // Discount Calculation Logic
        const calculateDiscount = () => {
            const mrp = parseFloat(mrpInput.value) || 0;
            const selling = parseFloat(sellingInput.value) || 0;
            if (mrp > 0 && selling > 0) {
                const discount = ((mrp - selling) / mrp) * 100;
                discountDisplay.value = Math.round(discount) + "% OFF";
            } else {
                discountDisplay.value = "0%";
            }
        };

        mrpInput.addEventListener('input', calculateDiscount);
        sellingInput.addEventListener('input', calculateDiscount);

        // Form Submission
        form.onsubmit = async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa fa-spinner animate-spin"></i> Publishing...`;

            try {
                const seriesData = {
                    name: document.getElementById('seriesName').value,
                    shortDescription: document.getElementById('shortDesc').value,
                    longDescription: document.getElementById('longDesc').value,
                    bannerUrl: document.getElementById('bannerUrl').value,
                    syllabusUrl: document.getElementById('syllabusUrl').value,
                    priceType: document.querySelector('input[name="priceType"]:checked').value,
                    mrp: parseFloat(mrpInput.value) || 0,
                    sellingPrice: parseFloat(sellingInput.value) || 0,
                    discount: discountDisplay.value,
                    validityMonths: parseInt(document.getElementById('validity').value) || 0,
                    totalTests: parseInt(document.getElementById('testCount').value) || 0,
                    subjects: document.getElementById('subjects').value.split(',').map(s => s.trim()),
                    language: document.getElementById('language').value,
                    shuffleQuestions: document.getElementById('shuffle').value,
                    showSolutions: document.getElementById('showSolutions').value,
                    negativeMarking: document.getElementById('negativeMarking').value,
                    launchDate: document.getElementById('launchDate').value,
                    featuredTag: document.getElementById('featuredTag').value,
                    status: document.getElementById('status').value,
                    excelLink: document.getElementById('excelLink').value,
                    createdAt: serverTimestamp(),
                    createdBy: auth.currentUser.uid
                };

                // Saving to Firestore Collection: test_series
                await addDoc(collection(db, "test_series"), seriesData);
                
                document.getElementById('successModal').classList.replace('hidden', 'flex');
            } catch (err) {
                console.error("Firebase Error:", err);
                alert("Database Error: " + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Publish Test Series";
            }
        };
    </script>
</body>
</html>
