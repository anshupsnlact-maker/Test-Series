<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .active-tab { background: #0f172a; color: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .student-list { display: flex; flex-direction: column; gap: 0.75rem; }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- MODAL: Nayi Test Series Banayein -->
    <div id="create-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl p-10 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-slate-800 italic">Create New Test Series</h2>
                <button onclick="closeModal('create-modal')" class="text-slate-300 hover:text-slate-600 transition"><i class="fa fa-times-circle text-2xl"></i></button>
            </div>
            
            <div class="grid md:grid-cols-2 gap-8">
                <div class="space-y-5">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Basic Details</label>
                    <input type="text" id="s-title" placeholder="Series Name (e.g. SSC Special)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    <textarea id="s-desc" placeholder="Series Description..." class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold h-24"></textarea>
                    <input type="number" id="s-price" placeholder="Price (INR)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                </div>
                <div class="space-y-5">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Test Setup</label>
                    <input type="number" id="s-validity" placeholder="Validity (Days)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    <input type="number" id="s-test-count" placeholder="Total Tests Count" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    <input type="text" id="s-sheet" placeholder="Google Sheet CSV Link" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    <input type="datetime-local" id="s-live-time" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-slate-500">
                </div>
            </div>

            <button onclick="publishSeries()" class="w-full mt-10 bg-blue-600 text-white py-5 rounded-[2rem] font-black shadow-xl shadow-blue-100 hover:bg-blue-700 transition transform active:scale-95">
                Publish Test Series Now
            </button>
        </div>
    </div>

    <!-- MODAL: Student Detailed View -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-[3rem] shadow-2xl p-10">
            <div id="user-modal-content" class="space-y-6">
                <!-- User data via JS -->
                <div class="animate-pulse flex flex-col items-center">
                    <div class="w-20 h-20 bg-slate-100 rounded-full mb-4"></div>
                    <div class="h-4 bg-slate-100 w-1/2 rounded mb-2"></div>
                    <div class="h-3 bg-slate-100 w-1/3 rounded"></div>
                </div>
            </div>
            <button onclick="closeModal('user-modal')" class="w-full mt-8 py-4 bg-slate-100 rounded-2xl font-black text-slate-500 hover:bg-slate-200 transition">Close Console</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <!-- Main Admin Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6 bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm">
            <div class="flex items-center gap-6">
                <div class="w-16 h-16 bg-slate-900 rounded-[2rem] flex items-center justify-center text-white text-3xl shadow-2xl">
                    <i class="fa fa-fingerprint"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-slate-800 tracking-tight">Admin Console</h1>
                    <p id="admin-id" class="text-xs font-bold text-blue-600 uppercase tracking-widest mt-1">Verifying Master Access...</p>
                </div>
            </div>
            <div class="flex gap-4 w-full md:w-auto">
                <button onclick="openModal('create-modal')" class="flex-1 md:flex-none bg-blue-600 text-white px-10 py-5 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 transition active:scale-95">
                    <i class="fa fa-plus-circle mr-2"></i> Add Test Series
                </button>
                <button onclick="logout()" class="w-16 h-16 bg-slate-50 rounded-2xl text-red-500 hover:bg-red-50 transition flex items-center justify-center text-xl">
                    <i class="fa fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- Control Bar: Tabs & View Switches -->
        <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
            <div class="flex gap-2 p-1.5 bg-slate-200/50 rounded-2xl w-fit">
                <button onclick="switchTab('users')" id="tab-users-btn" class="active-tab px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all">Registered Students</button>
                <button onclick="switchTab('series')" id="tab-series-btn" class="px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all text-slate-400">Active Series</button>
            </div>

            <!-- View Switcher (Grid/List) -->
            <div id="view-controls" class="flex gap-2 bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm">
                <button onclick="changeView('grid')" id="view-grid-btn" class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center transition">
                    <i class="fa fa-th-large"></i>
                </button>
                <button onclick="changeView('list')" id="view-list-btn" class="w-10 h-10 rounded-xl bg-white text-slate-400 flex items-center justify-center hover:bg-slate-50 transition">
                    <i class="fa fa-list"></i>
                </button>
            </div>
        </div>

        <!-- Section: Students -->
        <section id="section-users">
            <div id="students-container" class="student-grid">
                <!-- Students cards yahan aayenge -->
            </div>
        </section>

        <!-- Section: Test Series -->
        <section id="section-series" class="hidden">
            <div id="series-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Series cards yahan aayenge -->
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        import { firebaseConfig, ADMIN_EMAIL } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "exam-master-v1";

        let currentView = 'grid';

        // Security Guard
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                window.location.href = "index.html";
            } else {
                document.getElementById('admin-id').innerText = `Authorized: ${user.email}`;
                loadAllStudents();
                loadAllSeries();
            }
        });

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");

        // UI Handlers
        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        window.switchTab = (tab) => {
            document.getElementById('section-users').classList.toggle('hidden', tab !== 'users');
            document.getElementById('section-series').classList.toggle('hidden', tab !== 'series');
            document.getElementById('tab-users-btn').className = tab === 'users' ? 'active-tab px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all' : 'px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all text-slate-400';
            document.getElementById('tab-series-btn').className = tab === 'series' ? 'active-tab px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all' : 'px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all text-slate-400';
            document.getElementById('view-controls').classList.toggle('hidden', tab !== 'users');
        };

        window.changeView = (view) => {
            currentView = view;
            const container = document.getElementById('students-container');
            const gridBtn = document.getElementById('view-grid-btn');
            const listBtn = document.getElementById('view-list-btn');

            if(view === 'grid') {
                container.className = "student-grid";
                gridBtn.className = "w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center transition";
                listBtn.className = "w-10 h-10 rounded-xl bg-white text-slate-400 flex items-center justify-center transition";
            } else {
                container.className = "student-list";
                listBtn.className = "w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center transition";
                gridBtn.className = "w-10 h-10 rounded-xl bg-white text-slate-400 flex items-center justify-center transition";
            }
            loadAllStudents(); // Re-render with new layout
        };

        // Load Registered Students
        function loadAllStudents() {
            const container = document.getElementById('students-container');
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
                container.innerHTML = "";
                if(snap.empty) {
                    container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold italic">Abhi tak koi student register nahi hua hai.</div>`;
                    return;
                }

                snap.forEach(d => {
                    const s = d.data();
                    if(currentView === 'grid') {
                        container.innerHTML += `
                            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all group flex flex-col items-center text-center">
                                <img src="${s.photoURL || 'https://via.placeholder.com/150'}" class="w-20 h-20 rounded-full mb-4 border-4 border-slate-50 group-hover:scale-105 transition">
                                <h3 class="text-lg font-black text-slate-800 leading-tight">${s.displayName || 'Unnamed User'}</h3>
                                <p class="text-xs font-bold text-slate-400 mt-1">${s.email}</p>
                                <div class="flex gap-2 w-full mt-6">
                                    <button onclick="viewStudent('${d.id}')" class="flex-1 bg-slate-900 text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Details</button>
                                    <button onclick="toggleBlock('${d.id}', ${s.disabled || false})" class="px-4 py-3 bg-slate-50 rounded-xl ${s.disabled ? 'text-green-500' : 'text-red-400'} hover:bg-slate-100 transition">
                                        <i class="fa ${s.disabled ? 'fa-unlock' : 'fa-ban'}"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        container.innerHTML += `
                            <div class="bg-white p-5 rounded-2xl border border-slate-100 flex items-center justify-between hover:border-blue-200 transition">
                                <div class="flex items-center gap-4">
                                    <img src="${s.photoURL || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-full border-2 border-slate-50">
                                    <div>
                                        <h3 class="font-black text-slate-800 text-sm">${s.displayName || 'Unnamed User'}</h3>
                                        <p class="text-[10px] font-bold text-slate-400">${s.email}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="viewStudent('${d.id}')" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-[9px] font-black uppercase">View Details</button>
                                    <button onclick="toggleBlock('${d.id}', ${s.disabled || false})" class="w-10 h-10 bg-slate-50 rounded-xl ${s.disabled ? 'text-green-500' : 'text-red-400'}"><i class="fa ${s.disabled ? 'fa-unlock' : 'fa-ban'}"></i></button>
                                </div>
                            </div>
                        `;
                    }
                });
            });
        }

        // --- View Student Deep Analytics ---
        window.viewStudent = (uid) => {
            openModal('user-modal');
            const modalContent = document.getElementById('user-modal-content');
            
            const pRef = collection(db, 'artifacts', appId, 'users', uid, 'purchases');
            const sRef = collection(db, 'artifacts', appId, 'users', uid, 'scores');

            onSnapshot(pRef, (pSnap) => {
                onSnapshot(sRef, (sSnap) => {
                    let purchases = pSnap.docs.map(d => `<span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-[9px] font-black uppercase">${d.data().title}</span>`).join(' ');
                    let scores = sSnap.docs.map(d => `
                        <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl">
                            <span class="text-xs font-bold text-slate-600">${d.data().testName}</span>
                            <span class="text-xs font-black text-blue-600">${d.data().score}%</span>
                        </div>
                    `).join('');

                    modalContent.innerHTML = `
                        <div class="text-center mb-6">
                            <h2 class="text-2xl font-black text-slate-800">Student Profile</h2>
                            <p class="text-xs font-bold text-slate-400">UID: ${uid}</p>
                        </div>
                        <div class="space-y-6">
                            <div>
                                <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-3">Enrolled Series</p>
                                <div class="flex flex-wrap gap-2">${purchases || '<p class="text-xs italic text-slate-300">No purchases yet.</p>'}</div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-3">Test Performance</p>
                                <div class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar">${scores || '<p class="text-xs italic text-slate-300">No tests attempted.</p>'}</div>
                            </div>
                        </div>
                    `;
                });
            });
        };

        // --- Test Series Logic ---
        window.publishSeries = async () => {
            const title = document.getElementById('s-title').value;
            const desc = document.getElementById('s-desc').value;
            const price = document.getElementById('s-price').value;
            const validity = document.getElementById('s-validity').value;
            const tests = document.getElementById('s-test-count').value;
            const sheet = document.getElementById('s-sheet').value;
            const live = document.getElementById('s-live-time').value;

            if(!title || !sheet) return alert("Pehle basic information bharein!");

            try {
                await addDoc(collection(db, "tests"), {
                    title, desc, price, validity, testCount: tests, sheetLink: sheet,
                    liveAt: live ? new Date(live) : serverTimestamp(),
                    createdAt: serverTimestamp()
                });
                alert("Test Series Live Ho Chuki Hai!");
                closeModal('create-modal');
            } catch (err) { alert("Error: " + err.message); }
        };

        function loadAllAllSeries() {
            onSnapshot(collection(db, "tests"), (snap) => {
                const container = document.getElementById('series-container');
                container.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    container.innerHTML += `
                        <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 flex justify-between items-center shadow-sm hover:border-blue-100 transition">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                    <h3 class="text-lg font-black text-slate-800">${data.title}</h3>
                                </div>
                                <p class="text-xs text-slate-400 font-medium line-clamp-1 mb-4">${data.desc || 'No description'}</p>
                                <div class="flex gap-4 items-center">
                                    <span class="text-[10px] font-black text-slate-900 bg-slate-50 px-3 py-1 rounded-lg">₹${data.price}</span>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${data.testCount} Tests • ${data.validity} Days</span>
                                </div>
                            </div>
                            <button onclick="deleteSeries('${d.id}')" class="w-12 h-12 bg-red-50 text-red-500 rounded-2xl hover:bg-red-500 hover:text-white transition shadow-sm">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    `;
                });
            });
        }

        window.deleteSeries = async (id) => {
            if(confirm("Kya aap is series ko delete karna chahte hain?")) {
                await deleteDoc(doc(db, "tests", id));
            }
        };

        window.toggleBlock = async (uid, current) => {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', uid), {
                disabled: !current
            });
        };

        // Initial Load
        loadAllAllSeries();
    </script>
</body>
</html>
