<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .user-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .user-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .modal-overlay { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); }
        
        /* Custom Scrollbar for better look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white sticky top-0 z-50 border-b border-slate-200 px-4 md:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-100">
                <i class="fa fa-graduation-cap text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Admin Dashboard</h1>
        </div>

        <!-- New Action Buttons -->
        <div class="flex items-center gap-2 md:gap-4 flex-wrap">
            <button onclick="window.location.href='view_series.html'" class="flex items-center gap-2 bg-slate-100 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-slate-200 transition-all">
                <i class="fa fa-layer-group"></i>
                <span class="hidden sm:inline">View Existing Test Series</span>
                <span class="sm:hidden">View Series</span>
            </button>
            
            <button onclick="window.location.href='create_series.html'" class="flex items-center gap-2 bg-blue-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">
                <i class="fa fa-plus-circle"></i>
                <span class="hidden sm:inline">Create New Test Series</span>
                <span class="sm:hidden">Create New</span>
            </button>

            <div class="h-8 w-[1px] bg-slate-200 mx-2 hidden md:block"></div>

            <button id="logout-btn" class="text-red-500 font-bold text-xs hover:bg-red-50 px-4 py-2.5 rounded-xl transition-all flex items-center gap-2 border border-transparent hover:border-red-100">
                <i class="fa fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="mb-10">
            <h2 class="text-3xl font-black text-slate-900 tracking-tight">Registered Students</h2>
            <p class="text-slate-500 font-medium mt-1">Manage and monitor all existing and new student profiles.</p>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="flex flex-col items-center justify-center py-24">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-b-blue-600"></div>
            <p class="mt-6 text-slate-400 font-bold uppercase text-[10px] tracking-[0.2em]">Syncing Student Records...</p>
        </div>

        <!-- Users Grid -->
        <div id="user-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- User cards go here -->
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="user-modal" class="fixed inset-0 modal-overlay hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden relative border border-white/20">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-300 hover:text-slate-800 transition-colors">
                <i class="fa fa-times-circle text-3xl"></i>
            </button>
            
            <div id="modal-content" class="p-8 md:p-10">
                <!-- User details load here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userGrid = document.getElementById('user-grid');
        const loader = document.getElementById('loader');
        const userModal = document.getElementById('user-modal');
        const modalContent = document.getElementById('modal-content');

        let studentsData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html";
                return;
            }
            fetchAllUsers();
        });

        function fetchAllUsers() {
            const usersRef = collection(db, "users");
            
            onSnapshot(usersRef, (snapshot) => {
                studentsData = [];
                userGrid.innerHTML = '';
                loader.classList.add('hidden');
                userGrid.classList.remove('hidden');

                if (snapshot.empty) {
                    userGrid.innerHTML = `
                        <div class="col-span-full py-20 text-center">
                            <i class="fa fa-users-slash text-4xl text-slate-200 mb-4"></i>
                            <p class="text-slate-400 font-bold uppercase tracking-widest text-[11px]">No users found in database</p>
                        </div>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = { uid: doc.id, ...doc.data() };
                    studentsData.push(data);
                    renderCard(data, studentsData.length - 1);
                });
            }, (error) => {
                console.error("Firestore Error:", error);
                loader.innerHTML = `<p class="text-red-500 font-bold text-xs uppercase">Error: ${error.message}</p>`;
            });
        }

        function renderCard(user, index) {
            const card = document.createElement('div');
            card.className = "user-card bg-white p-6 rounded-[2rem] cursor-pointer shadow-sm relative overflow-hidden group";
            card.onclick = () => openUserDetail(index);

            const purchaseCount = user.purchasedSeries ? user.purchasedSeries.length : 0;

            card.innerHTML = `
                <div class="flex items-center gap-5">
                    <div class="relative">
                        <img src="${user.photoURL || 'https://ui-avatars.com/api/?background=0D8ABC&color=fff&name=' + user.displayName}" 
                             class="w-16 h-16 rounded-2xl object-cover bg-slate-50 border-2 border-white shadow-md">
                        <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-green-500 border-4 border-white rounded-full"></div>
                    </div>
                    <div class="overflow-hidden">
                        <h3 class="font-bold text-slate-800 truncate text-lg group-hover:text-blue-600 transition-colors">${user.displayName || 'Anonymous Student'}</h3>
                        <p class="text-xs text-slate-400 truncate font-semibold">${user.email}</p>
                    </div>
                </div>
                <div class="mt-6 pt-5 border-t border-slate-50 flex justify-between items-center">
                    <div>
                         <p class="text-[9px] font-black text-slate-300 uppercase tracking-tighter">Reference UID</p>
                         <p class="text-[10px] font-mono text-slate-400">${user.uid.substring(0, 12)}...</p>
                    </div>
                    <div class="${purchaseCount > 0 ? 'bg-blue-50 text-blue-600' : 'bg-slate-50 text-slate-400'} text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-wider">
                        ${purchaseCount} Purchases
                    </div>
                </div>
            `;
            userGrid.appendChild(card);
        }

        window.openUserDetail = (index) => {
            const u = studentsData[index];
            const purchases = u.purchasedSeries || [];

            modalContent.innerHTML = `
                <div class="flex flex-col items-center text-center mb-8">
                    <img src="${u.photoURL || 'https://ui-avatars.com/api/?name=' + u.displayName}" 
                         class="w-28 h-28 rounded-[2rem] shadow-2xl mb-5 border-4 border-white">
                    <h2 class="text-2xl font-black text-slate-800 tracking-tight">${u.displayName || 'Unknown Student'}</h2>
                    <p class="text-slate-400 font-bold text-sm tracking-wide">${u.email}</p>
                </div>

                <div class="space-y-6">
                    <div>
                        <p class="text-[10px] font-black text-slate-300 uppercase mb-2 tracking-widest">Internal User ID</p>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 relative group">
                            <p class="text-[11px] font-mono text-slate-500 break-all leading-relaxed">${u.uid}</p>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Purchased Modules</p>
                            <span class="bg-blue-600 text-white text-[9px] px-2 py-0.5 rounded-full font-bold">${purchases.length}</span>
                        </div>
                        <div class="max-h-48 overflow-y-auto space-y-3 pr-2">
                            ${purchases.length > 0 ? purchases.map(p => `
                                <div class="p-4 bg-white border border-slate-100 rounded-2xl flex justify-between items-center shadow-sm">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center">
                                            <i class="fa fa-check text-green-500 text-xs"></i>
                                        </div>
                                        <span class="text-xs font-bold text-slate-700">${p.name || 'Test Series Item'}</span>
                                    </div>
                                    <span class="text-[9px] font-black text-slate-300 uppercase italic">Active Access</span>
                                </div>
                            `).join('') : `
                                <div class="py-8 text-center bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                    <p class="text-slate-400 text-[11px] font-bold uppercase tracking-tighter">No active subscriptions</p>
                                </div>
                            `}
                        </div>
                    </div>

                    <div class="pt-6 border-t border-slate-50 flex justify-between items-center text-[10px]">
                         <div class="flex flex-col">
                            <span class="text-slate-300 font-black uppercase">Role Status</span>
                            <span class="text-slate-800 font-bold">Standard Student</span>
                         </div>
                         <div class="flex flex-col text-right">
                            <span class="text-slate-300 font-black uppercase">Latest Activity</span>
                            <span class="text-slate-800 font-bold">
                                ${u.lastLogin ? (u.lastLogin.toDate ? u.lastLogin.toDate().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Active Now') : 'N/A'}
                            </span>
                         </div>
                    </div>
                </div>
            `;
            userModal.classList.replace('hidden', 'flex');
        };

        window.closeModal = () => {
            userModal.classList.replace('flex', 'hidden');
        };

        userModal.onclick = (e) => { if(e.target === userModal) closeModal(); };

        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };
    </script>
</body>
</html>
