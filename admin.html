<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Super Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .active-tab { background: #0f172a; color: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .student-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10 pb-20">

    <!-- MODAL: Create Test Series with File Upload -->
    <div id="create-modal" class="fixed inset-0 bg-slate-900/60 z-[200] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl p-10 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-slate-800 italic">Create New Test Series</h2>
                <button onclick="closeModal('create-modal')" class="text-slate-300 hover:text-slate-600 transition"><i class="fa fa-times-circle text-2xl"></i></button>
            </div>
            
            <div class="grid md:grid-cols-2 gap-8">
                <div class="space-y-5">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Series Details</label>
                    <input type="text" id="s-title" placeholder="Series Name" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    <textarea id="s-desc" placeholder="Series Description..." class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold h-24"></textarea>
                    <input type="number" id="s-price" placeholder="Price (INR)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                </div>
                <div class="space-y-5">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">File & Validity</label>
                    <input type="number" id="s-validity" placeholder="Validity (Days)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    
                    <!-- CSV File Input -->
                    <div class="relative group">
                        <label for="csv-file" class="flex flex-col items-center justify-center w-full p-6 bg-blue-50 text-blue-600 border-2 border-dashed border-blue-200 rounded-2xl cursor-pointer group-hover:bg-blue-100 transition font-bold">
                            <i class="fa fa-file-csv text-2xl mb-2"></i>
                            <span id="file-name-label" class="text-[10px] uppercase">Upload .csv File</span>
                        </label>
                        <input type="file" id="csv-file" accept=".csv" class="hidden" onchange="updateFileLabel()">
                    </div>
                    
                    <input type="datetime-local" id="s-live-time" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-slate-500">
                </div>
            </div>

            <button id="publish-btn" onclick="publishSeries()" class="w-full mt-10 bg-blue-600 text-white py-5 rounded-[2rem] font-black shadow-xl hover:bg-blue-700 transition transform active:scale-95">
                Upload & Publish Now
            </button>
        </div>
    </div>

    <!-- MODAL: Student Details View -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/60 z-[200] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-[3rem] shadow-2xl p-10">
            <div id="user-modal-content" class="space-y-6 text-center">
                <p class="text-slate-400 font-bold italic">Fetching student data...</p>
            </div>
            <button onclick="closeModal('user-modal')" class="w-full mt-8 py-4 bg-slate-100 rounded-2xl font-black text-slate-500 hover:bg-slate-200 transition">Close Panel</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <!-- Header Section -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6 bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm">
            <div class="flex items-center gap-6">
                <div class="w-16 h-16 bg-slate-900 rounded-[2rem] flex items-center justify-center text-white text-3xl shadow-2xl">
                    <i class="fa fa-fingerprint"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-slate-800 tracking-tight">Admin Console</h1>
                    <p id="auth-status" class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mt-1 italic">Securing Connection...</p>
                </div>
            </div>
            <div class="flex gap-4 w-full md:w-auto">
                <button onclick="openModal('create-modal')" class="flex-1 md:flex-none bg-blue-600 text-white px-10 py-5 rounded-2xl font-black shadow-lg hover:bg-blue-700 transition active:scale-95">
                    <i class="fa fa-plus-circle mr-2"></i> New Test Series
                </button>
                <button onclick="logout()" class="w-16 h-16 bg-slate-50 rounded-2xl text-red-500 hover:bg-red-50 transition flex items-center justify-center text-xl">
                    <i class="fa fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- View Controls & Tabs -->
        <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
            <div class="flex gap-2 p-1.5 bg-slate-200/50 rounded-2xl w-fit">
                <button onclick="switchTab('users')" id="tab-users-btn" class="active-tab px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all">Registered Students</button>
                <button onclick="switchTab('series')" id="tab-series-btn" class="px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all text-slate-400">Live Series</button>
            </div>

            <div id="view-controls" class="flex gap-2 bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm">
                <button onclick="changeView('grid')" id="view-grid-btn" class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center transition"><i class="fa fa-th-large"></i></button>
                <button onclick="changeView('list')" id="view-list-btn" class="w-10 h-10 rounded-xl bg-white text-slate-400 flex items-center justify-center transition"><i class="fa fa-list"></i></button>
            </div>
        </div>

        <!-- Registered Students Section -->
        <section id="section-users">
            <div id="students-container" class="student-grid"></div>
        </section>

        <!-- Published Series Section -->
        <section id="section-series" class="hidden">
            <div id="series-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // Environment Config (No keys hardcoded)
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentView = 'grid';

        // Secure Auth Logic
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-status').innerText = `Authorized Access: ${user.uid}`;
                loadStudents();
                loadSeries();
            }
        });

        // UI Functions
        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.logout = () => signOut(auth).then(() => location.reload());

        window.updateFileLabel = () => {
            const file = document.getElementById('csv-file').files[0];
            const label = document.getElementById('file-name-label');
            if (file) {
                label.innerText = file.name;
                label.parentElement.className = "flex flex-col items-center justify-center w-full p-6 bg-green-50 text-green-600 border-2 border-dashed border-green-200 rounded-2xl cursor-pointer group-hover:bg-green-100 transition font-bold";
            }
        };

        window.switchTab = (tab) => {
            document.getElementById('section-users').classList.toggle('hidden', tab !== 'users');
            document.getElementById('section-series').classList.toggle('hidden', tab !== 'series');
            document.getElementById('tab-users-btn').className = tab === 'users' ? 'active-tab px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all' : 'px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all text-slate-400';
            document.getElementById('tab-series-btn').className = tab === 'series' ? 'active-tab px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all' : 'px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all text-slate-400';
            document.getElementById('view-controls').classList.toggle('hidden', tab !== 'users');
        };

        window.changeView = (view) => {
            currentView = view;
            const container = document.getElementById('students-container');
            container.className = view === 'grid' ? 'student-grid' : 'student-list';
            document.getElementById('view-grid-btn').className = view === 'grid' ? 'w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center' : 'w-10 h-10 rounded-xl bg-white text-slate-400 flex items-center justify-center';
            document.getElementById('view-list-btn').className = view === 'list' ? 'w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center' : 'w-10 h-10 rounded-xl bg-white text-slate-400 flex items-center justify-center';
            loadStudents();
        };

        // STUDENT MANAGEMENT
        function loadStudents() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
                const container = document.getElementById('students-container');
                container.innerHTML = "";
                snap.forEach(docSnap => {
                    const s = docSnap.data();
                    const html = currentView === 'grid' ? `
                        <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col items-center text-center">
                            <img src="${s.photoURL || 'https://via.placeholder.com/150'}" class="w-20 h-20 rounded-full mb-4 border-4 border-slate-50">
                            <h3 class="text-lg font-black text-slate-800">${s.displayName || 'Unnamed User'}</h3>
                            <p class="text-xs font-bold text-slate-400 mt-1">${s.email}</p>
                            <div class="flex gap-2 w-full mt-6">
                                <button onclick="viewStudentDetails('${docSnap.id}')" class="flex-1 bg-slate-900 text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Details</button>
                                <button onclick="toggleUserStatus('${docSnap.id}', ${s.disabled})" class="px-4 py-3 bg-slate-50 rounded-xl ${s.disabled ? 'text-green-500' : 'text-red-400'}"><i class="fa ${s.disabled ? 'fa-unlock' : 'fa-ban'}"></i></button>
                            </div>
                        </div>
                    ` : `
                        <div class="bg-white p-5 rounded-2xl border border-slate-100 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <img src="${s.photoURL || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-full">
                                <div>
                                    <h3 class="font-black text-slate-800 text-sm">${s.displayName}</h3>
                                    <p class="text-[10px] font-bold text-slate-400">${s.email}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="viewStudentDetails('${docSnap.id}')" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-[9px] font-black uppercase">View Details</button>
                                <button onclick="toggleUserStatus('${docSnap.id}', ${s.disabled})" class="w-10 h-10 bg-slate-50 rounded-xl ${s.disabled ? 'text-green-500' : 'text-red-400'}"><i class="fa ${s.disabled ? 'fa-unlock' : 'fa-ban'}"></i></button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            });
        }

        window.toggleUserStatus = async (uid, isBlocked) => {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', uid), { disabled: !isBlocked });
        };

        window.viewStudentDetails = (uid) => {
            openModal('user-modal');
            const content = document.getElementById('user-modal-content');
            // Fetch scores and purchases logic same as before...
            onSnapshot(collection(db, 'artifacts', appId, 'users', uid, 'scores'), (snap) => {
                let scores = snap.docs.map(d => `<div class="p-4 bg-slate-50 rounded-xl flex justify-between"><span>${d.data().testName}</span><b>${d.data().score}%</b></div>`).join('');
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6">Student Analytics</h2>
                    <div class="space-y-3 text-left max-h-[300px] overflow-y-auto custom-scrollbar">
                        ${scores || '<p class="text-center text-slate-400 italic">No tests attempted yet.</p>'}
                    </div>
                `;
            });
        };

        // TEST SERIES MANAGEMENT
        window.publishSeries = async () => {
            const btn = document.getElementById('publish-btn');
            const file = document.getElementById('csv-file').files[0];
            const title = document.getElementById('s-title').value;

            if(!file || !title) return alert("Pehle Title aur CSV file select karein!");

            try {
                btn.disabled = true;
                btn.innerText = "Uploading CSV to Storage...";

                // 1. Upload to Storage (Path: artifacts/appId/public/data/csv_files/...)
                const fileRef = ref(storage, `artifacts/${appId}/public/data/csv_files/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(fileRef, file);
                const fileUrl = await getDownloadURL(snapshot.ref);

                // 2. Save Data to Firestore
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'tests'), {
                    title: title,
                    desc: document.getElementById('s-desc').value,
                    price: document.getElementById('s-price').value,
                    validity: document.getElementById('s-validity').value,
                    sheetLink: fileUrl,
                    liveAt: document.getElementById('s-live-time').value || serverTimestamp(),
                    createdAt: serverTimestamp()
                });

                alert("Test Series Live Ho Chuki Hai!");
                closeModal('create-modal');
                location.reload();
            } catch (err) {
                alert("Upload failed: " + err.message);
                btn.disabled = false;
                btn.innerText = "Upload & Publish Now";
            }
        };

        function loadSeries() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'tests'), (snap) => {
                const container = document.getElementById('series-container');
                container.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    container.innerHTML += `
                        <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 flex justify-between items-center shadow-sm">
                            <div class="flex-1">
                                <h3 class="text-lg font-black text-slate-800">${data.title}</h3>
                                <div class="flex gap-4 items-center mt-3">
                                    <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-lg">₹${data.price}</span>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${data.validity} Days Validity</span>
                                </div>
                            </div>
                            <button onclick="deleteSeries('${d.id}')" class="w-12 h-12 bg-red-50 text-red-500 rounded-2xl hover:bg-red-500 hover:text-white transition"><i class="fa fa-trash"></i></button>
                        </div>
                    `;
                });
            });
        }

        window.deleteSeries = async (id) => {
            if(confirm("Confirm Delete Series?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tests', id));
        };
    </script>
</body>
</html>
