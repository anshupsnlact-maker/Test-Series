<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .user-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation Header -->
    <header class="glass-header sticky top-0 z-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center">
                <i class="fa fa-graduation-cap text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">Admin Panel</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <a href="upload.html" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg shadow-blue-100 transition-all">
                <i class="fa fa-plus"></i> Upload Test Series
            </a>
            <button id="logout-btn" class="text-slate-500 hover:text-red-600 font-bold text-sm">Logout</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <!-- Stats Section -->
        <div class="mb-10">
            <h2 class="text-2xl font-extrabold text-slate-800">Registered Students</h2>
            <p class="text-slate-500">Manage and view user purchase history</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-slate-500 font-medium">Fetching secure data...</p>
        </div>

        <!-- Error State -->
        <div id="error-box" class="hidden bg-red-50 border border-red-100 p-6 rounded-2xl text-center">
            <i class="fa fa-exclamation-triangle text-red-500 text-3xl mb-3"></i>
            <h3 class="text-red-800 font-bold">Access Denied or Error</h3>
            <p id="error-msg" class="text-red-600 text-sm"></p>
        </div>

        <!-- Users Grid -->
        <div id="user-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- User cards will be injected here -->
        </div>
    </main>

    <!-- Details Modal -->
    <div id="user-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-[2rem] p-8 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-800">
                <i class="fa fa-times text-xl"></i>
            </button>
            <div id="modal-content">
                <!-- Data will be dynamic -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Importing your secure config
        import { firebaseConfig, ADMIN_EMAIL } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userGrid = document.getElementById('user-grid');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error-box');
        const errorMsg = document.getElementById('error-msg');
        const userModal = document.getElementById('user-modal');
        const modalContent = document.getElementById('modal-content');

        // Global state for users
        let allUsers = [];

        // Check Auth and Admin Access
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html"; // Redirect to login if not logged in
                return;
            }

            if (user.email !== ADMIN_EMAIL) {
                loading.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorMsg.innerText = "Authorized access only. Your account (" + user.email + ") is not an admin.";
                // Logout unauthorized users after 3 seconds
                setTimeout(() => signOut(auth), 3000);
                return;
            }

            // If Admin, fetch data
            fetchUsersData();
        });

        async function fetchUsersData() {
            try {
                // Rule: Fetching all users from your public data or users collection
                // Replace 'users' with your actual collection name where student data is stored
                const querySnapshot = await getDocs(collection(db, 'users'));
                allUsers = [];
                
                querySnapshot.forEach((doc) => {
                    allUsers.push({ id: doc.id, ...doc.data() });
                });

                renderUsers();
            } catch (err) {
                console.error(err);
                loading.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorMsg.innerText = "Error loading database: " + err.message;
            }
        }

        function renderUsers() {
            loading.classList.add('hidden');
            userGrid.classList.remove('hidden');
            userGrid.innerHTML = '';

            if (allUsers.length === 0) {
                userGrid.innerHTML = '<p class="text-slate-400 col-span-full text-center py-10">No students registered yet.</p>';
                return;
            }

            allUsers.forEach((user, index) => {
                const card = document.createElement('div');
                card.className = "user-card bg-white p-6 rounded-3xl shadow-sm border border-slate-100 cursor-pointer";
                card.onclick = () => showUserDetails(index);
                
                card.innerHTML = `
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center font-bold text-lg">
                            ${(user.displayName || user.email || 'U').charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 truncate w-40">${user.displayName || 'Unnamed User'}</h3>
                            <p class="text-xs text-slate-500">${user.email}</p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-4 border-t border-slate-50">
                        <span class="text-[10px] uppercase font-black tracking-widest text-slate-400">Series Owned</span>
                        <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-lg">
                            ${user.purchasedSeries ? user.purchasedSeries.length : 0} Items
                        </span>
                    </div>
                `;
                userGrid.appendChild(card);
            });
        }

        window.showUserDetails = (index) => {
            const user = allUsers[index];
            const seriesList = user.purchasedSeries || [];
            
            modalContent.innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-slate-900 text-white rounded-[2rem] flex items-center justify-center mx-auto mb-4 text-3xl shadow-xl">
                        ${(user.displayName || 'U').charAt(0).toUpperCase()}
                    </div>
                    <h2 class="text-2xl font-black text-slate-800">${user.displayName || 'User Profile'}</h2>
                    <p class="text-slate-500 text-sm">${user.email}</p>
                </div>
                
                <div class="space-y-4">
                    <h4 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa fa-shopping-cart text-blue-600"></i> Purchased Test Series
                    </h4>
                    <div class="max-h-60 overflow-y-auto pr-2 space-y-2">
                        ${seriesList.length > 0 ? seriesList.map(item => `
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-slate-800 text-sm">${item.name || 'Test Series'}</p>
                                    <p class="text-[10px] text-slate-400">UID: ${item.id || 'N/A'}</p>
                                </div>
                                <span class="text-blue-600 font-bold text-xs">Active</span>
                            </div>
                        `).join('') : '<p class="text-slate-400 text-sm italic">No series purchased yet.</p>'}
                    </div>
                </div>

                <div class="mt-8 grid grid-cols-2 gap-4">
                    <div class="p-4 bg-blue-50 rounded-2xl">
                        <p class="text-[10px] text-blue-400 uppercase font-bold">Total Spent</p>
                        <p class="text-lg font-black text-blue-700">₹${user.totalSpent || 0}</p>
                    </div>
                    <div class="p-4 bg-purple-50 rounded-2xl">
                        <p class="text-[10px] text-purple-400 uppercase font-bold">Last Active</p>
                        <p class="text-sm font-black text-purple-700">${user.lastLogin || 'Today'}</p>
                    </div>
                </div>
            `;
            
            userModal.classList.remove('hidden');
            userModal.classList.add('flex');
        };

        window.closeModal = () => {
            userModal.classList.add('hidden');
            userModal.classList.remove('flex');
        };

        // Logout functionality
        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };

        // Close modal on outside click
        window.onclick = (event) => {
            if (event.target == userModal) closeModal();
        };
    </script>
</body>
</html>
