<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .user-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .user-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .modal-overlay { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white sticky top-0 z-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                <i class="fa fa-graduation-cap text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800">Admin Dashboard</h1>
        </div>
        <button id="logout-btn" class="text-red-500 font-bold text-sm hover:bg-red-50 px-4 py-2 rounded-lg transition-all">Logout</button>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="mb-10">
            <h2 class="text-3xl font-black text-slate-900">Registered Students</h2>
            <p class="text-slate-500">Purane (Existing) aur Naye users ki poori list yahan hai.</p>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-slate-500 font-bold uppercase text-[10px] tracking-widest">Fetching All Users...</p>
        </div>

        <!-- Users Grid -->
        <div id="user-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Saare users yahan card form mein dikhenge -->
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="user-modal" class="fixed inset-0 modal-overlay hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden relative">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-800 transition-colors">
                <i class="fa fa-times-circle text-2xl"></i>
            </button>
            
            <div id="modal-content" class="p-8">
                <!-- User details yahan load honge -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase configuration same rakhi hai
        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userGrid = document.getElementById('user-grid');
        const loader = document.getElementById('loader');
        const userModal = document.getElementById('user-modal');
        const modalContent = document.getElementById('modal-content');

        let studentsData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html";
                return;
            }
            fetchAllUsers();
        });

        // Yeh function purane aur naye saare users ko fetch karega
        function fetchAllUsers() {
            const usersRef = collection(db, "users");
            
            // onSnapshot database mein se purana data bhi uthata hai aur naya bhi monitor karta hai
            onSnapshot(usersRef, (snapshot) => {
                studentsData = [];
                userGrid.innerHTML = '';
                loader.classList.add('hidden');
                userGrid.classList.remove('hidden');

                if (snapshot.empty) {
                    userGrid.innerHTML = '<p class="col-span-full text-center py-10 text-slate-400 font-bold uppercase tracking-widest text-[10px]">Database mein koi user nahi hai</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = { uid: doc.id, ...doc.data() };
                    studentsData.push(data);
                    renderCard(data, studentsData.length - 1);
                });
            }, (error) => {
                console.error("Firestore Error:", error);
                loader.innerHTML = `<p class="text-red-500 font-bold text-xs uppercase tracking-widest">Error: ${error.message}</p>`;
            });
        }

        function renderCard(user, index) {
            const card = document.createElement('div');
            card.className = "user-card bg-white p-6 rounded-3xl cursor-pointer shadow-sm";
            card.onclick = () => openUserDetail(index);

            card.innerHTML = `
                <div class="flex items-center gap-4">
                    <img src="${user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName}" class="w-14 h-14 rounded-2xl bg-slate-50 border border-slate-100">
                    <div class="overflow-hidden">
                        <h3 class="font-bold text-slate-800 truncate text-lg">${user.displayName || 'Anonymous'}</h3>
                        <p class="text-sm text-slate-400 truncate font-medium">${user.email}</p>
                    </div>
                </div>
                <div class="mt-6 pt-4 border-t border-slate-50 flex justify-between items-center">
                    <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">UID: ${user.uid.substring(0, 10)}...</span>
                    <div class="bg-blue-50 text-blue-600 text-[9px] font-black px-2 py-1 rounded-md uppercase">
                        ${user.purchasedSeries ? user.purchasedSeries.length : 0} Purchases
                    </div>
                </div>
            `;
            userGrid.appendChild(card);
        }

        window.openUserDetail = (index) => {
            const u = studentsData[index];
            const purchases = u.purchasedSeries || [];

            modalContent.innerHTML = `
                <div class="flex flex-col items-center text-center">
                    <img src="${u.photoURL || 'https://ui-avatars.com/api/?name=' + u.displayName}" class="w-24 h-24 rounded-3xl shadow-xl mb-4 border-4 border-white">
                    <h2 class="text-2xl font-black text-slate-800">${u.displayName || 'Unknown Student'}</h2>
                    <p class="text-slate-400 font-bold text-sm mb-6">${u.email}</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <p class="text-[9px] font-black text-slate-300 uppercase mb-1 tracking-widest">User ID Reference</p>
                        <p class="bg-slate-50 p-3 rounded-xl text-[11px] font-mono text-slate-600 border border-slate-100 break-all">${u.uid}</p>
                    </div>

                    <div>
                        <p class="text-[9px] font-black text-slate-300 uppercase mb-2 tracking-widest">Purchase History</p>
                        <div class="max-h-40 overflow-y-auto space-y-2 pr-2">
                            ${purchases.length > 0 ? purchases.map(p => `
                                <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl flex justify-between items-center">
                                    <span class="text-xs font-bold text-slate-700">${p.name || 'Test Series'}</span>
                                    <span class="text-[10px] font-black text-green-500 uppercase">Paid</span>
                                </div>
                            `).join('') : '<p class="text-slate-400 text-xs italic py-4 text-center">Abhi tak koi series nahi kharidi gayi.</p>'}
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-50 flex justify-between items-center">
                        <span class="text-[10px] text-slate-300 font-black uppercase">Registered User</span>
                        <span class="text-[10px] font-black text-slate-500">
                           Last Login: ${u.lastLogin ? (u.lastLogin.toDate ? u.lastLogin.toDate().toLocaleDateString() : 'Active') : 'N/A'}
                        </span>
                    </div>
                </div>
            `;
            userModal.classList.replace('hidden', 'flex');
        };

        window.closeModal = () => {
            userModal.classList.replace('flex', 'hidden');
        };

        userModal.onclick = (e) => { if(e.target === userModal) closeModal(); };

        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };
    </script>
</body>
</html>
