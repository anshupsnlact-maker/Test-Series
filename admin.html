<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-6xl mx-auto">
        <!-- Admin Header -->
        <header class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-slate-900 rounded-3xl flex items-center justify-center text-white text-2xl shadow-xl">
                    <i class="fa fa-shield-alt"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-800 leading-none">Security Console</h1>
                    <p class="text-xs font-bold text-slate-400 mt-2 uppercase tracking-widest">Master Administrator Access</p>
                </div>
            </div>
            <button onclick="logout()" class="bg-white text-red-500 px-8 py-4 rounded-2xl font-black text-sm shadow-sm hover:shadow-md transition">Log Out</button>
        </header>

        <div class="grid lg:grid-cols-3 gap-8">
            <!-- Left: Add Test Series Form -->
            <div class="lg:col-span-1 bg-white p-10 rounded-[3rem] shadow-sm border border-slate-200">
                <h2 class="text-xl font-black text-slate-800 mb-8 flex items-center gap-3">
                    <i class="fa fa-plus-circle text-blue-600"></i> New Series
                </h2>
                <div class="space-y-5">
                    <div>
                        <label class="text-[10px] font-black text-slate-300 uppercase tracking-widest ml-1 mb-2 block">Exam Title</label>
                        <input type="text" id="t-title" placeholder="SSC CGL Mock 01" class="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-300 uppercase tracking-widest ml-1 mb-2 block">Price (INR)</label>
                        <input type="number" id="t-price" placeholder="499" class="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-300 uppercase tracking-widest ml-1 mb-2 block">Duration (Mins)</label>
                        <input type="number" id="t-duration" placeholder="60" class="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 font-bold">
                    </div>
                    <button id="publish-btn" class="w-full bg-blue-600 text-white py-6 rounded-2xl font-black shadow-xl shadow-blue-100 hover:bg-blue-700 transition transform active:scale-95">Publish Test Series</button>
                </div>
            </div>

            <!-- Right: Live Statistics & List -->
            <div class="lg:col-span-2 bg-slate-900 p-10 rounded-[3rem] text-white shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 p-10 opacity-10">
                    <i class="fa fa-chart-line text-9xl"></i>
                </div>
                <h2 class="text-xl font-black mb-10 flex items-center gap-3">
                    <i class="fa fa-database text-blue-400"></i> Active Database
                </h2>
                
                <div id="stats-summary" class="grid grid-cols-2 gap-4 mb-10">
                    <div class="bg-white/5 p-6 rounded-3xl">
                        <p class="text-[10px] font-black text-slate-500 uppercase mb-1">Total Series</p>
                        <h3 id="total-count" class="text-3xl font-black italic">0</h3>
                    </div>
                    <div class="bg-white/5 p-6 rounded-3xl">
                        <p class="text-[10px] font-black text-slate-500 uppercase mb-1">Admin Status</p>
                        <h3 class="text-lg font-black text-green-400 uppercase tracking-widest">Active</h3>
                    </div>
                </div>

                <div class="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">Manage Live Items</p>
                    <div id="tests-list" class="space-y-3">
                        <!-- Dynamic List -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Secure Import from config.js
        import { firebaseConfig, ADMIN_EMAIL } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");

        // Force Admin Security
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                window.location.href = "index.html";
            } else {
                loadSeries();
            }
        });

        // Publish Handler
        document.getElementById('publish-btn').onclick = async () => {
            const title = document.getElementById('t-title').value.trim();
            const price = document.getElementById('t-price').value;
            const duration = document.getElementById('t-duration').value;

            if(!title || !price || !duration) return alert("Kripya saari jankari bharein!");

            try {
                await addDoc(collection(db, "tests"), {
                    title, price, duration, createdAt: serverTimestamp()
                });
                alert("Mubarak ho! Test series live ho chuki hai.");
                document.getElementById('t-title').value = "";
                document.getElementById('t-price').value = "";
                document.getElementById('t-duration').value = "";
            } catch (err) {
                alert("Permission Denied: Database rules check karein.");
            }
        };

        function loadSeries() {
            onSnapshot(collection(db, "tests"), (snap) => {
                const list = document.getElementById('tests-list');
                const countDisplay = document.getElementById('total-count');
                list.innerHTML = "";
                countDisplay.innerText = snap.size;

                if(snap.empty) {
                    list.innerHTML = `<p class="text-slate-600 italic text-sm text-center py-10">Koi bhi series nahi mili.</p>`;
                    return;
                }

                snap.forEach(d => {
                    const data = d.data();
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-white/5 p-6 rounded-3xl hover:bg-white/10 transition group">
                            <div>
                                <span class="text-sm font-black block">${data.title}</span>
                                <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1 block">₹${data.price} • ${data.duration} MINS</span>
                            </div>
                            <button onclick="deleteSeries('${d.id}')" class="w-10 h-10 bg-red-500/10 text-red-500 rounded-xl flex items-center justify-center hover:bg-red-500 hover:text-white transition">
                                <i class="fa fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                });
            });
        }

        window.deleteSeries = async (id) => {
            const confirmDel = confirm("Kya aap wakayi ise delete karna chahte hain? Ye wapas nahi aayega.");
            if(confirmDel) {
                try {
                    await deleteDoc(doc(db, "tests", id));
                } catch (err) { alert("Error deleting document!"); }
            }
        }
    </script>
</body>
</html>
