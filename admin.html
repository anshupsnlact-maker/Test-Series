<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMaster - Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .tab-btn.active { background: #0f172a; color: white; }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- MODAL: Create New Series -->
    <div id="create-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl p-8 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-slate-800">Setup New Series</h2>
                <button onclick="closeModal('create-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times-circle text-2xl"></i></button>
            </div>
            
            <div class="grid md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Series Info</label>
                    <input type="text" id="s-title" placeholder="Series Name" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold">
                    <textarea id="s-desc" placeholder="Short Description" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold h-24"></textarea>
                    <input type="number" id="s-price" placeholder="Price (INR)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold">
                </div>
                <div class="space-y-4">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Test Configuration</label>
                    <input type="number" id="s-validity" placeholder="Validity (Days)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold">
                    <input type="number" id="s-test-count" placeholder="Total Number of Tests" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold">
                    <input type="text" id="s-sheet" placeholder="Google Sheet URL (CSV Export)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold">
                </div>
            </div>

            <div class="mt-8 flex gap-4">
                <div class="flex-1">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2">Live Timing</label>
                    <input type="datetime-local" id="s-live-time" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                </div>
                <button onclick="publishSeries()" class="flex-[1.5] bg-blue-600 text-white rounded-2xl font-black shadow-xl shadow-blue-100 hover:bg-blue-700 mt-6 transition active:scale-95">Create & Live</button>
            </div>
        </div>
    </div>

    <!-- MODAL: User Details View -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] shadow-2xl p-8">
            <div id="user-modal-content">
                <!-- User data will load here -->
                <p class="text-center py-10 font-bold text-slate-400 italic">User ki detail fetch ho rahi hai...</p>
            </div>
            <button onclick="closeModal('user-modal')" class="w-full mt-6 py-4 bg-slate-100 rounded-2xl font-black text-slate-600">Close Window</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <!-- Dashboard Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-slate-900 rounded-3xl flex items-center justify-center text-white text-2xl shadow-xl">
                    <i class="fa fa-user-shield"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-800">Admin Command Center</h1>
                    <p id="admin-id" class="text-xs font-bold text-blue-600">Checking Authorization...</p>
                </div>
            </div>
            <div class="flex gap-4 w-full md:w-auto">
                <button onclick="openModal('create-modal')" class="flex-1 md:flex-none bg-blue-600 text-white px-8 py-4 rounded-2xl font-black shadow-lg shadow-blue-100 hover:bg-blue-700 transition active:scale-95">
                    <i class="fa fa-plus-circle mr-2"></i> New Series
                </button>
                <button onclick="logout()" class="w-12 h-12 bg-white rounded-2xl text-red-500 shadow-sm border border-slate-100"><i class="fa fa-power-off"></i></button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex gap-2 p-1 bg-slate-200/50 rounded-2xl mb-8 w-fit">
            <button onclick="switchAdminTab('users')" id="tab-users-btn" class="tab-btn active px-6 py-3 rounded-xl font-black text-xs uppercase tracking-widest transition">Live Students</button>
            <button onclick="switchAdminTab('series')" id="tab-series-btn" class="tab-btn px-6 py-3 rounded-xl font-black text-xs uppercase tracking-widest transition">Test Series</button>
        </div>

        <!-- Section: Users List -->
        <section id="section-users" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="students-grid">
                <!-- Students cards will appear here -->
            </div>
        </section>

        <!-- Section: Series List -->
        <section id="section-series" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div id="series-grid" class="contents">
                <!-- Series cards will appear here -->
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        import { firebaseConfig, ADMIN_EMAIL } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "exam-master-v1";

        // Auth Protection
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                window.location.href = "index.html";
            } else {
                document.getElementById('admin-id').innerText = `Admin: ${user.email}`;
                loadStudents();
                loadSeries();
            }
        });

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");

        // UI Helpers
        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        
        window.switchAdminTab = (tab) => {
            document.getElementById('section-users').classList.toggle('hidden', tab !== 'users');
            document.getElementById('section-series').classList.toggle('hidden', tab !== 'series');
            document.getElementById('tab-users-btn').classList.toggle('active', tab === 'users');
            document.getElementById('tab-series-btn').classList.toggle('active', tab === 'series');
        };

        // --- FEATURE: Load Live Students ---
        function loadStudents() {
            const studentsGrid = document.getElementById('students-grid');
            // We listen to the public students collection
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
                studentsGrid.innerHTML = "";
                snap.forEach(d => {
                    const student = d.data();
                    studentsGrid.innerHTML += `
                        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col items-center text-center group">
                            <div class="relative">
                                <img src="${student.photoURL || 'https://via.placeholder.com/150'}" class="w-20 h-20 rounded-full border-4 border-slate-50 mb-4 object-cover">
                                <div class="absolute bottom-4 right-0 w-5 h-5 ${student.disabled ? 'bg-red-500' : 'bg-green-500'} border-4 border-white rounded-full"></div>
                            </div>
                            <h3 class="font-black text-slate-800">${student.displayName || 'Anonymous'}</h3>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter mb-4">${student.email}</p>
                            
                            <div class="flex gap-2 w-full mt-auto">
                                <button onclick="viewUserDetails('${d.id}')" class="flex-1 bg-slate-900 text-white py-3 rounded-xl text-xs font-bold">Details</button>
                                <button onclick="toggleUserStatus('${d.id}', ${student.disabled || false})" class="px-4 py-3 bg-slate-50 ${student.disabled ? 'text-green-500' : 'text-red-500'} rounded-xl text-xs">
                                    <i class="fa ${student.disabled ? 'fa-user-check' : 'fa-user-slash'}"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // --- FEATURE: View User Analytics ---
        window.viewUserDetails = async (uid) => {
            openModal('user-modal');
            const content = document.getElementById('user-modal-content');
            
            // 1. Fetch Purchased Items
            const purchasesRef = collection(db, 'artifacts', appId, 'users', uid, 'purchases');
            // 2. Fetch Attempt History (Results)
            const scoresRef = collection(db, 'artifacts', appId, 'users', uid, 'scores');

            onSnapshot(purchasesRef, (pSnap) => {
                onSnapshot(scoresRef, (sSnap) => {
                    let purchasesHTML = pSnap.docs.map(d => `<span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-black uppercase">${d.data().title}</span>`).join(' ');
                    let scoresHTML = sSnap.docs.map(d => `
                        <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                            <span class="text-xs font-black">${d.data().testName}</span>
                            <span class="text-xs font-black text-blue-600">${d.data().score}%</span>
                        </div>
                    `).join('');

                    content.innerHTML = `
                        <h2 class="text-xl font-black text-slate-800 mb-6">Student Activity</h2>
                        <div class="space-y-6">
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Enrolled In</p>
                                <div class="flex flex-wrap gap-2">${purchasesHTML || '<span class="text-xs italic text-slate-300">No active series</span>'}</div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Attempt History</p>
                                <div class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">${scoresHTML || '<p class="text-xs italic text-slate-300">Aisa koi test attempt nahi kiya.</p>'}</div>
                            </div>
                        </div>
                    `;
                });
            });
        };

        // --- FEATURE: Manage Test Series ---
        window.publishSeries = async () => {
            const title = document.getElementById('s-title').value;
            const desc = document.getElementById('s-desc').value;
            const price = document.getElementById('s-price').value;
            const validity = document.getElementById('s-validity').value;
            const testCount = document.getElementById('s-test-count').value;
            const sheet = document.getElementById('s-sheet').value;
            const liveAt = document.getElementById('s-live-time').value;

            if(!title || !sheet) return alert("Title aur Google Sheet Link zaroori hai!");

            try {
                await addDoc(collection(db, "tests"), {
                    title, desc, price, validity, testCount, sheetLink: sheet,
                    liveAt: liveAt ? new Date(liveAt) : serverTimestamp(),
                    createdAt: serverTimestamp()
                });
                alert("Nayi Series Live Ho Chuki Hai!");
                closeModal('create-modal');
            } catch (err) { alert(err.message); }
        };

        function loadSeries() {
            const seriesGrid = document.getElementById('series-grid');
            onSnapshot(collection(db, "tests"), (snap) => {
                seriesGrid.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    seriesGrid.innerHTML += `
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 flex justify-between items-start">
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="bg-green-100 text-green-600 px-2 py-1 rounded-lg text-[8px] font-black uppercase">Live Series</span>
                                    <h3 class="text-lg font-black text-slate-800">${data.title}</h3>
                                </div>
                                <p class="text-xs text-slate-400 font-medium mb-4">${data.desc || 'No description'}</p>
                                <div class="flex gap-4 text-[10px] font-black text-slate-500 uppercase">
                                    <span><i class="fa fa-list-ol mr-1"></i> ${data.testCount} Tests</span>
                                    <span><i class="fa fa-clock mr-1"></i> ${data.validity} Days</span>
                                    <span class="text-blue-600">₹${data.price}</span>
                                </div>
                            </div>
                            <button onclick="deleteSeries('${d.id}')" class="w-10 h-10 bg-red-50 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition">
                                <i class="fa fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                });
            });
        }

        window.deleteSeries = async (id) => {
            if(confirm("Ye series delete karein?")) await deleteDoc(doc(db, "tests", id));
        };

        window.toggleUserStatus = async (uid, currentStatus) => {
            const studentRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', uid);
            await updateDoc(studentRef, { disabled: !currentStatus });
        };
    </script>
</body>
</html>
