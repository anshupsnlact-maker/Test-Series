<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .user-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #f1f5f9; position: relative; }
        .user-card:hover { transform: translateY(-8px); border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.1); }
        .modal-overlay { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); }
        .profile-img-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); }
        .status-badge { position: absolute; top: 1.5rem; right: 1.5rem; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-white sticky top-0 z-50 border-b border-slate-200 px-4 md:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-100">
                <i class="fa fa-graduation-cap text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Management Console</h1>
        </div>

        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="window.location.href='view_series.html'" class="flex items-center gap-2 bg-slate-100 text-slate-700 font-bold text-xs px-5 py-3 rounded-xl hover:bg-slate-200 transition-all">
                <i class="fa fa-layer-group"></i> <span class="hidden sm:inline">Existing Series</span>
            </button>
            <button onclick="window.location.href='create_series.html'" class="flex items-center gap-2 bg-blue-600 text-white font-bold text-xs px-5 py-3 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">
                <i class="fa fa-plus-circle"></i> <span class="hidden sm:inline">Launch New Series</span>
            </button>
            <button id="logout-btn" class="text-red-500 font-bold text-xs hover:bg-red-50 px-4 py-3 rounded-xl transition-all border border-transparent hover:border-red-100">
                <i class="fa fa-power-off text-lg"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="mb-12">
            <h2 class="text-4xl font-black text-slate-900 tracking-tight">User Directory</h2>
            <p class="text-slate-500 font-medium mt-2">Monitor system users, manage access levels, and audit subscriptions.</p>
        </div>

        <!-- Loading State -->
        <div id="loader" class="flex flex-col items-center justify-center py-32">
            <div class="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="mt-6 text-slate-400 font-bold uppercase text-[10px] tracking-widest">Synchronizing Records...</p>
        </div>

        <!-- Grid Layout -->
        <div id="user-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Dynamic User Cards -->
        </div>
    </main>

    <!-- Detailed Modal -->
    <div id="user-modal" class="fixed inset-0 modal-overlay hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-lg rounded-[3rem] shadow-2xl overflow-hidden relative border border-white/20">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-300 hover:text-slate-800 transition-colors z-10">
                <i class="fa fa-times-circle text-3xl"></i>
            </button>
            
            <div id="modal-content" class="p-10">
                <!-- User Data Injected Here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userGrid = document.getElementById('user-grid');
        const loader = document.getElementById('loader');
        const userModal = document.getElementById('user-modal');
        const modalContent = document.getElementById('modal-content');

        let studentsData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html";
                return;
            }
            fetchUserDirectory();
        });

        function fetchUserDirectory() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                studentsData = [];
                userGrid.innerHTML = '';
                loader.classList.add('hidden');
                userGrid.classList.remove('hidden');

                snapshot.forEach((doc) => {
                    const data = { uid: doc.id, ...doc.data() };
                    studentsData.push(data);
                    renderUserCard(data, studentsData.length - 1);
                });
            });
        }

        function renderUserCard(user, index) {
            const card = document.createElement('div');
            const isDisabled = user.status === 'disabled';
            card.className = `user-card bg-white p-8 rounded-[2.5rem] cursor-pointer text-center flex flex-col items-center ${isDisabled ? 'opacity-70 grayscale' : ''}`;
            card.onclick = () => openProfile(index);

            card.innerHTML = `
                <div class="status-badge">
                    <span class="w-3 h-3 rounded-full inline-block ${isDisabled ? 'bg-red-500' : 'bg-green-500'}"></span>
                </div>
                <div class="relative mb-6">
                    <img src="${user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName}" 
                         class="w-24 h-24 rounded-[2.2rem] object-cover border-4 border-slate-50 profile-img-glow">
                </div>
                <h3 class="font-bold text-slate-800 text-xl mb-1 truncate w-full">${user.displayName || 'Unnamed User'}</h3>
                <p class="text-sm text-slate-400 font-medium truncate w-full mb-6">${user.email}</p>
                
                <div class="w-full pt-6 border-t border-slate-50 flex justify-between items-center">
                    <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">${isDisabled ? 'Suspended' : 'Verified Student'}</span>
                    <span class="${isDisabled ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600'} text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter">
                        ${user.purchasedSeries ? user.purchasedSeries.length : 0} Assets
                    </span>
                </div>
            `;
            userGrid.appendChild(card);
        }

        window.openProfile = (index) => {
            const u = studentsData[index];
            const purchases = u.purchasedSeries || [];
            const isDisabled = u.status === 'disabled';

            modalContent.innerHTML = `
                <div class="flex flex-col items-center text-center mb-10">
                    <img src="${u.photoURL}" class="w-28 h-28 rounded-[2.5rem] shadow-xl mb-6 border-4 border-white">
                    <h2 class="text-3xl font-black text-slate-800 mb-1">${u.displayName}</h2>
                    <p class="text-slate-400 font-bold text-sm tracking-wide mb-4">${u.email}</p>
                    <div class="bg-slate-100 text-slate-500 text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-tighter">Reference ID: ${u.uid}</div>
                </div>

                <div class="space-y-6">
                    <div>
                        <p class="text-[10px] font-black text-slate-300 uppercase mb-3 tracking-widest">Enrollment Details</p>
                        <div class="max-h-40 overflow-y-auto space-y-3 pr-2">
                            ${purchases.length > 0 ? purchases.map(p => `
                                <div class="p-4 bg-slate-50 border border-slate-100 rounded-2xl flex justify-between items-center">
                                    <span class="text-xs font-bold text-slate-700">${p.name || 'Educational Module'}</span>
                                    <span class="text-[9px] font-bold text-blue-500 uppercase">Paid</span>
                                </div>
                            `).join('') : '<div class="py-6 text-center text-slate-300 text-xs font-bold uppercase tracking-widest border border-dashed rounded-2xl">No Active Subscriptions</div>'}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-6 border-t border-slate-100">
                        <button onclick="toggleUserStatus('${u.uid}', '${isDisabled ? 'active' : 'disabled'}')" 
                                class="${isDisabled ? 'bg-green-50 text-green-600 hover:bg-green-600' : 'bg-orange-50 text-orange-600 hover:bg-orange-600'} hover:text-white font-black text-[10px] py-4 rounded-2xl uppercase tracking-widest transition-all">
                            ${isDisabled ? 'Enable Account' : 'Disable Account'}
                        </button>
                        <button onclick="removeUserAccount('${u.uid}')" class="bg-red-50 text-red-600 font-black text-[10px] py-4 rounded-2xl uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all">
                            Delete Account
                        </button>
                    </div>

                    <p class="text-[9px] text-center text-slate-400 font-bold uppercase tracking-widest mt-4">
                        Caution: Deletion is permanent and irreversible
                    </p>
                </div>
            `;
            userModal.classList.replace('hidden', 'flex');
        };

        window.toggleUserStatus = async (uid, newStatus) => {
            try {
                const userDoc = doc(db, "users", uid);
                await updateDoc(userDoc, { status: newStatus });
                closeModal();
            } catch (error) {
                console.error("Status Update Failed:", error);
            }
        };

        window.removeUserAccount = async (uid) => {
            const confirmDelete = confirm("Warning: You are about to permanently delete this account. Proceed?");
            if(confirmDelete) {
                try {
                    await deleteDoc(doc(db, "users", uid));
                    closeModal();
                } catch (error) {
                    console.error("Delete Operation Failed:", error);
                }
            }
        };

        window.closeModal = () => userModal.classList.replace('flex', 'hidden');
        userModal.onclick = (e) => { if(e.target === userModal) closeModal(); };

        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };
    </script>
</body>
</html>
