<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .user-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #f1f5f9; }
        .user-card:hover { transform: translateY(-8px); border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.1); }
        .modal-overlay { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); }
        .profile-img-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white sticky top-0 z-50 border-b border-slate-200 px-4 md:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-100">
                <i class="fa fa-graduation-cap text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Admin Portal</h1>
        </div>

        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="window.location.href='view_series.html'" class="flex items-center gap-2 bg-slate-100 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-slate-200 transition-all">
                <i class="fa fa-layer-group"></i> <span class="hidden sm:inline">Existing Series</span>
            </button>
            <button onclick="window.location.href='create_series.html'" class="flex items-center gap-2 bg-blue-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">
                <i class="fa fa-plus-circle"></i> <span class="hidden sm:inline">Create Series</span>
            </button>
            <button id="logout-btn" class="text-red-500 font-bold text-xs hover:bg-red-50 px-4 py-2.5 rounded-xl transition-all border border-transparent hover:border-red-100">
                <i class="fa fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="mb-12">
            <h2 class="text-4xl font-black text-slate-900 tracking-tight">Registered Users</h2>
            <p class="text-slate-500 font-medium mt-2">Manage student access and subscription details below.</p>
        </div>

        <!-- Loader -->
        <div id="loader" class="flex flex-col items-center justify-center py-32">
            <div class="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="mt-6 text-slate-400 font-bold uppercase text-[10px] tracking-widest">Loading Database...</p>
        </div>

        <!-- Users Grid (3 columns on desktop) -->
        <div id="user-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="user-modal" class="fixed inset-0 modal-overlay hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-lg rounded-[3rem] shadow-2xl overflow-hidden relative border border-white/20 animate-fade-in-up">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-300 hover:text-slate-800 transition-colors z-10">
                <i class="fa fa-times-circle text-3xl"></i>
            </button>
            
            <div id="modal-content" class="p-10">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userGrid = document.getElementById('user-grid');
        const loader = document.getElementById('loader');
        const userModal = document.getElementById('user-modal');
        const modalContent = document.getElementById('modal-content');

        let studentsData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html";
                return;
            }
            fetchAllUsers();
        });

        function fetchAllUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                studentsData = [];
                userGrid.innerHTML = '';
                loader.classList.add('hidden');
                userGrid.classList.remove('hidden');

                snapshot.forEach((doc) => {
                    const data = { uid: doc.id, ...doc.data() };
                    studentsData.push(data);
                    renderCard(data, studentsData.length - 1);
                });
            });
        }

        function renderCard(user, index) {
            const card = document.createElement('div');
            card.className = "user-card bg-white p-8 rounded-[2.5rem] cursor-pointer text-center flex flex-col items-center";
            card.onclick = () => openUserDetail(index);

            card.innerHTML = `
                <div class="relative mb-6">
                    <img src="${user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName}" 
                         class="w-24 h-24 rounded-[2rem] object-cover border-4 border-slate-50 profile-img-glow">
                    <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-green-500 border-4 border-white rounded-full"></div>
                </div>
                <h3 class="font-bold text-slate-800 text-xl mb-1 truncate w-full">${user.displayName || 'User'}</h3>
                <p class="text-sm text-slate-400 font-medium truncate w-full mb-6">${user.email}</p>
                
                <div class="w-full pt-6 border-t border-slate-50 flex justify-between items-center">
                    <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Status</span>
                    <span class="bg-blue-50 text-blue-600 text-[10px] font-black px-3 py-1 rounded-full uppercase">
                        ${user.purchasedSeries ? user.purchasedSeries.length : 0} Assets
                    </span>
                </div>
            `;
            userGrid.appendChild(card);
        }

        window.openUserDetail = (index) => {
            const u = studentsData[index];
            const purchases = u.purchasedSeries || [];

            modalContent.innerHTML = `
                <div class="flex flex-col items-center text-center mb-10">
                    <img src="${u.photoURL}" class="w-28 h-28 rounded-[2.5rem] shadow-xl mb-6 border-4 border-white">
                    <h2 class="text-3xl font-black text-slate-800 mb-1">${u.displayName}</h2>
                    <p class="text-slate-400 font-bold text-sm tracking-wide mb-4">${u.email}</p>
                    <div class="flex gap-2">
                         <span class="bg-slate-100 text-slate-500 text-[9px] font-black px-3 py-1 rounded-lg uppercase tracking-tighter">UID: ${u.uid.substring(0, 8)}...</span>
                    </div>
                </div>

                <div class="space-y-6">
                    <div>
                        <p class="text-[10px] font-black text-slate-300 uppercase mb-3 tracking-widest">Active Subscriptions</p>
                        <div class="max-h-40 overflow-y-auto space-y-3 pr-2">
                            ${purchases.length > 0 ? purchases.map(p => `
                                <div class="p-4 bg-slate-50 border border-slate-100 rounded-2xl flex justify-between items-center">
                                    <span class="text-xs font-bold text-slate-700">${p.name || 'Test Series'}</span>
                                    <i class="fa fa-check-circle text-green-500 text-sm"></i>
                                </div>
                            `).join('') : '<p class="text-slate-400 text-xs italic text-center py-4">No subscriptions found</p>'}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-6 border-t border-slate-100">
                        <button class="bg-slate-100 text-slate-400 font-black text-[10px] py-4 rounded-2xl uppercase tracking-widest cursor-not-allowed opacity-50">
                            Disable Account
                        </button>
                        <button onclick="deleteUserAccount('${u.uid}')" class="bg-red-50 text-red-600 font-black text-[10px] py-4 rounded-2xl uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all">
                            Delete Account
                        </button>
                    </div>

                    <p class="text-[9px] text-center text-slate-300 font-bold uppercase tracking-widest mt-4">
                        Action is permanent and cannot be undone
                    </p>
                </div>
            `;
            userModal.classList.replace('hidden', 'flex');
        };

        window.deleteUserAccount = async (uid) => {
            if(confirm("Kya aap sach mein is account ko delete karna chahte hain? Ye wapas nahi aayega!")) {
                try {
                    await deleteDoc(doc(db, "users", uid));
                    closeModal();
                    // onSnapshot automatic update kar dega grid ko
                } catch (error) {
                    alert("Delete karne mein error aaya: " + error.message);
                }
            }
        };

        window.closeModal = () => userModal.classList.replace('flex', 'hidden');
        userModal.onclick = (e) => { if(e.target === userModal) closeModal(); };

        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };
    </script>
</body>
</html>
