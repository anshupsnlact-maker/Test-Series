<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b px-8 py-4 flex justify-between items-center">
        <h1 class="text-xl font-black text-slate-800">Admin Panel</h1>
        <button id="logout" class="text-red-500 font-bold text-sm bg-red-50 px-4 py-2 rounded-xl">Logout</button>
    </nav>

    <main class="max-w-6xl mx-auto p-8">
        <div class="mb-10">
            <h2 class="text-3xl font-black text-slate-800">Sare Registered Users</h2>
            <p class="text-slate-500">Firestore se real-time user data.</p>
        </div>

        <div id="user-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400">Database se users fetch ho rahe hain...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html";
                return;
            }

            // Real-time listener for users
            onSnapshot(collection(db, "users"), (snapshot) => {
                const grid = document.getElementById('user-grid');
                grid.innerHTML = '';
                
                if (snapshot.empty) {
                    grid.innerHTML = '<p class="col-span-full text-center py-10">Koi user nahi mila.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const u = doc.data();
                    grid.innerHTML += `
                        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex items-center gap-4">
                            <img src="${u.photoURL || 'https://via.placeholder.com/50'}" class="w-12 h-12 rounded-2xl">
                            <div class="overflow-hidden">
                                <h4 class="font-bold text-slate-800 truncate">${u.displayName || 'Unknown'}</h4>
                                <p class="text-[10px] text-slate-400 truncate">${u.email}</p>
                            </div>
                        </div>`;
                });
            });
        });

        document.getElementById('logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
