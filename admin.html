<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .user-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center shadow-lg shadow-slate-200">
                <i class="fa fa-graduation-cap text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800">Admin Dashboard</h1>
        </div>
        
        <div class="flex items-center gap-6">
            <a href="upload.html" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg shadow-blue-100 transition-all">
                <i class="fa fa-cloud-upload"></i> Upload Test Series
            </a>
            <button id="logout-btn" class="text-slate-400 hover:text-red-500 font-bold text-sm transition-colors">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-8">
        <div class="mb-10">
            <h2 class="text-3xl font-extrabold text-slate-800">All Authenticated Users</h2>
            <p class="text-slate-500 font-medium">Firestore database se real-time user list.</p>
        </div>

        <!-- Loader -->
        <div id="loader" class="flex flex-col items-center justify-center py-24">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
            <p class="mt-4 text-slate-500 font-bold animate-pulse">Fetching users from Firestore...</p>
        </div>

        <!-- Users Grid -->
        <div id="user-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Cards injected here -->
        </div>
    </main>

    <!-- Detailed View Modal -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-10 relative shadow-2xl transform transition-all">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-400 hover:text-slate-900">
                <i class="fa fa-times text-2xl"></i>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        import { firebaseConfig, ADMIN_EMAIL } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userGrid = document.getElementById('user-grid');
        const loader = document.getElementById('loader');
        const userModal = document.getElementById('user-modal');
        const modalContent = document.getElementById('modal-content');

        let students = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html"; 
                return;
            }
            // Real-time listener setup
            listenToUsers();
        });

        // Firestore se real-time data fetch karne ke liye
        function listenToUsers() {
            const usersRef = collection(db, 'users');
            
            // onSnapshot se data automatic update hoga jab bhi koi naya user login karega
            onSnapshot(usersRef, (snapshot) => {
                students = [];
                snapshot.forEach(doc => {
                    students.push({ id: doc.id, ...doc.data() });
                });
                renderGrid();
            }, (error) => {
                console.error("Firestore Error:", error);
                loader.innerHTML = `<p class="text-red-500 font-bold text-center">Permission Denied: Database rules check karein.</p>`;
            });
        }

        function renderGrid() {
            loader.classList.add('hidden');
            userGrid.classList.remove('hidden');
            userGrid.innerHTML = '';

            if (students.length === 0) {
                userGrid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 font-medium">No authenticated users found.</div>';
                return;
            }

            students.forEach((s, i) => {
                const card = document.createElement('div');
                card.className = "user-card bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm cursor-pointer transition-all duration-300";
                card.onclick = () => showUserDetail(i);
                
                card.innerHTML = `
                    <div class="flex items-center gap-5 mb-6">
                        <img src="${s.photoURL || 'https://ui-avatars.com/api/?name='+s.displayName}" class="w-14 h-14 rounded-2xl shadow-sm">
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-slate-800 truncate">${s.displayName || 'Student'}</h3>
                            <p class="text-xs text-slate-400 truncate">${s.email}</p>
                        </div>
                    </div>
                    <div class="pt-6 border-t border-slate-50 flex justify-between items-center">
                        <span class="text-[10px] font-black uppercase tracking-widest text-slate-300">Status</span>
                        <span class="bg-green-50 text-green-600 text-[10px] font-black px-3 py-1 rounded-lg">
                            AUTHENTICATED
                        </span>
                    </div>
                `;
                userGrid.appendChild(card);
            });
        }

        window.showUserDetail = (idx) => {
            const s = students[idx];
            const series = s.purchasedSeries || [];
            modalContent.innerHTML = `
                <div class="text-center mb-8">
                    <img src="${s.photoURL || 'https://ui-avatars.com/api/?name='+s.displayName}" class="w-24 h-24 rounded-3xl mx-auto mb-4 shadow-xl border-4 border-white">
                    <h2 class="text-2xl font-black text-slate-800">${s.displayName || 'Student'}</h2>
                    <p class="text-slate-400 font-medium text-sm">${s.email}</p>
                </div>
                
                <div class="space-y-4">
                    <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Ownership Details</h4>
                    <p class="text-sm text-slate-600 font-medium">Series Purchased: <span class="text-blue-600 font-bold">${series.length}</span></p>
                    <div class="max-h-52 overflow-y-auto pr-2 space-y-2">
                        ${series.length > 0 ? series.map(item => `
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                <p class="font-bold text-slate-700 text-sm">${item.name || 'Test Series'}</p>
                                <span class="text-green-600 font-bold text-[10px] bg-green-50 px-2 py-1 rounded-lg">ACTIVE</span>
                            </div>
                        `).join('') : '<p class="text-slate-400 italic text-sm text-center py-4 bg-slate-50 rounded-xl">No active series purchases.</p>'}
                    </div>
                </div>

                <div class="mt-8 pt-8 border-t border-slate-100 flex justify-between">
                    <div>
                        <p class="text-[10px] font-black text-slate-300 uppercase">Last Login</p>
                        <p class="text-xs font-bold text-slate-800">${s.lastLogin || 'Unknown'}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-black text-slate-300 uppercase">User UID</p>
                        <p class="text-[10px] font-bold text-slate-400 truncate w-24 ml-auto">${s.id}</p>
                    </div>
                </div>
            `;
            userModal.classList.replace('hidden', 'flex');
        };

        window.closeModal = () => userModal.classList.replace('flex', 'hidden');
        
        document.getElementById('logout-btn').onclick = () => signOut(auth);
        
        window.onclick = (e) => { if(e.target == userModal) closeModal(); }
    </script>
</body>
</html>
