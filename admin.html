<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ExamMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .user-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .user-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fa fa-graduation-cap text-white"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Admin <span class="text-blue-600">Console</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-[10px] font-black bg-green-100 text-green-600 px-3 py-1 rounded-full uppercase">Live Database</span>
            <button id="logout-btn" class="text-slate-400 hover:text-red-500 font-bold text-sm transition-colors">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-8">
        <div class="mb-10">
            <h2 class="text-3xl font-black text-slate-900">Registered Students</h2>
            <p class="text-slate-500 font-medium">Click on any card to see full profile and purchase history.</p>
        </div>

        <!-- Loader -->
        <div id="loader" class="flex flex-col items-center justify-center py-32">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
            <p class="mt-4 text-slate-400 font-bold animate-pulse uppercase text-[10px] tracking-widest">Fetching Firestore Data...</p>
        </div>

        <!-- Users Grid -->
        <div id="user-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <!-- User Detail Modal -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl transform transition-all relative">
            <!-- Modal Header / Cover -->
            <div class="h-32 bg-slate-900 relative">
                <button onclick="closeModal()" class="absolute top-6 right-6 w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center transition-all">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            
            <div class="px-10 pb-10 -mt-12 relative">
                <div id="modal-body">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZMtyDal6GIvuwCWojzyWUe5DWiKfFGHc",
            authDomain: "test-series-e94cf.firebaseapp.com",
            projectId: "test-series-e94cf",
            storageBucket: "test-series-e94cf.firebasestorage.app",
            messagingSenderId: "1089405186531",
            appId: "1:1089405186531:web:5c47280e47e5373bf4f0d6",
            measurementId: "G-C25TJCVEJK"
        };
        const ADMIN_EMAIL = "anshupsnlact@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userGrid = document.getElementById('user-grid');
        const loader = document.getElementById('loader');
        const userModal = document.getElementById('user-modal');
        const modalBody = document.getElementById('modal-body');

        let allUsers = [];

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                window.location.href = "index.html";
                return;
            }
            startRealtimeListener();
        });

        function startRealtimeListener() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                allUsers = [];
                loader.classList.add('hidden');
                userGrid.classList.remove('hidden');
                userGrid.innerHTML = '';

                snapshot.forEach((doc) => {
                    const userData = { id: doc.id, ...doc.data() };
                    allUsers.push(userData);
                    renderUserCard(userData, allUsers.length - 1);
                });

                if (snapshot.empty) {
                    userGrid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400">No users found in database.</div>';
                }
            });
        }

        function renderUserCard(u, index) {
            const card = document.createElement('div');
            card.className = "user-card bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm cursor-pointer hover:shadow-xl";
            card.onclick = () => showUserDetail(index);
            
            card.innerHTML = `
                <div class="flex items-center gap-4">
                    <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+u.displayName}" class="w-14 h-14 rounded-2xl border-2 border-slate-50">
                    <div class="overflow-hidden">
                        <h3 class="font-bold text-slate-800 truncate">${u.displayName || 'Student'}</h3>
                        <p class="text-xs text-slate-400 truncate">${u.email}</p>
                    </div>
                </div>
                <div class="mt-6 pt-5 border-t border-slate-50 flex justify-between items-center">
                    <div class="text-[9px] font-black text-slate-300 uppercase tracking-tighter">UID: ${u.id.substring(0, 12)}...</div>
                    <div class="bg-blue-50 text-blue-600 text-[10px] font-black px-3 py-1 rounded-lg uppercase">
                        ${u.purchasedSeries ? u.purchasedSeries.length : 0} Items
                    </div>
                </div>
            `;
            userGrid.appendChild(card);
        }

        window.showUserDetail = (index) => {
            const u = allUsers[index];
            const series = u.purchasedSeries || [];
            
            modalBody.innerHTML = `
                <div class="text-center mb-8">
                    <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+u.displayName}" class="w-24 h-24 rounded-[2rem] mx-auto border-4 border-white shadow-xl mb-4 bg-white">
                    <h2 class="text-2xl font-black text-slate-900">${u.displayName || 'Student'}</h2>
                    <p class="text-slate-500 font-medium text-sm">${u.email}</p>
                </div>

                <div class="space-y-6">
                    <div>
                        <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-3">User Identifier</h4>
                        <div class="bg-slate-50 p-4 rounded-2xl text-[11px] font-mono text-slate-500 break-all border border-slate-100">
                            ${u.id}
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Purchased Test Series</h4>
                            <span class="bg-slate-900 text-white text-[9px] px-2 py-0.5 rounded-md">${series.length}</span>
                        </div>
                        
                        <div class="max-h-48 overflow-y-auto custom-scrollbar space-y-2 pr-2">
                            ${series.length > 0 ? series.map(s => `
                                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center gap-3">
                                    <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center text-xs">
                                        <i class="fa fa-check"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-slate-800">${s.name || 'Untitled Series'}</p>
                                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-tighter">Status: Active</p>
                                    </div>
                                </div>
                            `).join('') : `
                                <div class="text-center py-8 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                    <p class="text-slate-400 text-xs font-medium italic text-center px-4">User ne abhi tak koi test series nahi kharidi hai.</p>
                                </div>
                            `}
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-6 border-t border-slate-100">
                        <div>
                            <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Last Activity</p>
                            <p class="text-xs font-bold text-slate-700">${u.lastLogin ? (u.lastLogin.toDate ? u.lastLogin.toDate().toLocaleString() : u.lastLogin) : 'N/A'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Account Type</p>
                            <p class="text-xs font-bold text-blue-600">Student Portal</p>
                        </div>
                    </div>
                </div>
            `;
            userModal.classList.replace('hidden', 'flex');
        };

        window.closeModal = () => {
            userModal.classList.replace('flex', 'hidden');
        };

        // Close on outside click
        window.onclick = (e) => { if (e.target == userModal) closeModal(); };

        document.getElementById('logout-btn').onclick = () => signOut(auth);
    </script>
</body>
</html>
